ion":"Chọn đoạn code điền vào ___ để in ra tên của sinh viên có GPA cao nhất.","code":"st = [{'n': 'A', 'g': 3.2}, {'n': 'B', 'g': 3.9}, {'n': 'C', 'g': 3.5}]\nbest_st = max(___)\nprint(best_st['n'])","options":["st, key=lambda x: x['g']","sorted(st)","st, key='g'","st, x['g']"],"answer":0,"explanation":"Hàm max() cần tham số 'key' là một hàm (thường dùng lambda) để xác định tiêu chí so sánh giữa các dictionary trong list. 'lambda x: x['g']' lấy giá trị gpa làm tiêu chí.","hint":"Cần một hàm bổ trợ để chỉ ra rằng chúng ta muốn so sánh dựa trên khóa 'g'.","errorCategory":"method","tags":["sorted-key"],"source":"exam","reserve":false,"expect":"B"},{"id":"T5-Q50","topic":"T5","difficulty":2,"type":"replace","question":"Chọn đoạn code điền vào ___ để lấy các số lẻ từ danh sách và nhân chúng với 10.","code":"vals = [1, 2, 3, 4]\nres = ___\nprint(list(res))","options":["map(lambda x: x*10, filter(lambda x: x%2!=0, vals))","map(lambda x: x%2!=0, filter(lambda x: x*10, vals))","filter(lambda x: x*10, map(lambda x: x%2!=0, vals))","[x*10 if x%2!=0 for x in vals]"],"answer":0,"explanation":"Cần lọc (filter) các số lẻ trước (1, 3), sau đó mới áp dụng phép nhân (map) lên các số đã lọc để có (10, 30).","hint":"Thứ tự đúng: Lọc điều kiện trước, biến đổi giá trị sau.","errorCategory":"logic","tags":["map-filter"],"source":"supplement","reserve":true,"expect":"[10, 30]"},{"id":"T5-Q51","topic":"T5","difficulty":2,"type":"replace","question":"Dòng ___ ban đầu là `nums.sort(key=lambda x: abs(x))`. Đoạn nào thay thế được dòng đó mà kết quả không đổi?","code":"nums = [-5, 2, -1, 4]\n___\nprint(nums)","options":["nums = sorted(abs(nums))","nums.sort(key=abs)","nums.sort(abs)","nums = nums.sort(key=abs)"],"answer":1,"explanation":"Hàm abs là hàm có sẵn trả về giá trị tuyệt đối. 'key=abs' tương đương với 'key=lambda x: abs(x)'. Phương án 'nums = nums.sort()' sai vì sort() trả về None.","hint":"Có thể dùng tên hàm trực tiếp làm key nếu hàm đó nhận vào một đối số.","errorCategory":"method","tags":["sorted-key"],"source":"textbook","reserve":false,"expect":"[-1, 2, 4, -5]"},{"id":"T6-Q01","topic":"T6","difficulty":1,"type":"output","question":"Đoạn code sau mô phỏng thao tác ghi file ở chế độ 'w'. Kết quả in ra là gì?","code":"import io\n\nfile_sim = io.StringIO()\n# Giả lập ghi lần 1\nfile_sim.write(\"Hello PTIT\")\n# Giả lập mở lại cùng file đó ở chế độ 'w'\nfile_sim = io.StringIO()\nfile_sim.write(\"Python\")\nprint(file_sim.getvalue())","options":["Python","Hello PTIT","Hello PTITPython","Lỗi FileExistsError"],"answer":0,"explanation":"Trong Python, khi mở file với chế độ 'w' (write), nếu file đã tồn tại, nội dung cũ sẽ bị xóa hoàn toàn (overwrite) trước khi ghi nội dung mới. io.StringIO() khởi tạo lại tương đương với việc mở mới hoàn toàn.","hint":"Chế độ 'w' có bảo lưu dữ liệu cũ không?","errorCategory":"concept","tags":["file-open-modes"],"source":"textbook","reserve":false},{"id":"T6-Q02","topic":"T6","difficulty":1,"type":"theory","question":"Phát biểu nào sau đây là ĐÚNG về từ khóa 'with' khi làm việc với file trong Python?","code":"","options":["Nó tự động đóng file ngay cả khi có exception xảy ra bên trong khối lệnh.","Nó giúp mã chạy nhanh hơn đáng kể.","Nó bắt buộc người dùng phải khai báo kiểu dữ liệu cho biến file.","Nó cho phép mở nhiều file cùng lúc nhưng chỉ đóng được file cuối cùng."],"answer":0,"explanation":"Từ khóa 'with' thiết lập một context manager, đảm bảo phương thức __exit__ (đóng file) luôn được gọi dù khối lệnh kết thúc bình thường hay do lỗi.","hint":"Lợi ích chính của context manager là gì?","errorCategory":"theory","tags":["with-statement"],"source":"textbook","reserve":false},{"id":"T6-Q03","topic":"T6","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import io\n\ncontent = \"10\\n20\\nabc\\n30\"\nf = io.StringIO(content)\ntotal = 0\nfor line in f:\n    try:\n        total += int(line.strip())\n    except ValueError:\n        continue\nprint(total)","options":["ValueError","30","60","0"],"answer":2,"explanation":"Vòng lặp duyệt qua từng dòng. '10', '20', '30' được chuyển thành số nguyên và cộng dồn. 'abc' gây lỗi ValueError nhưng được xử lý bởi except và bỏ qua bằng continue. Tổng = 10+20+30=60.","hint":"Lệnh continue làm gì khi gặp lỗi chuyển đổi?","errorCategory":"execution","tags":["try-except","split-parse"],"source":"exam","reserve":false},{"id":"T6-Q04","topic":"T6","difficulty":2,"type":"output","question":"Cho đoạn code mô phỏng đọc file sau. Kết quả in ra là gì?","code":"import io\n\ndata = \"Python\\nJava\\nC++\"\nf = io.StringIO(data)\nlines = f.readlines()\nprint(len(lines), repr(lines[0]))","options":["2 'Python\\n'","3 'Python'","3 'Python\\n'","IndexError"],"answer":2,"explanation":"readlines() trả về list các dòng và GIỮ NGUYÊN ký tự '\n' ở cuối mỗi dòng (trừ dòng cuối nếu file không kết thúc bằng xuống dòng). Có 3 dòng nên len là 3; dòng đầu là 'Python\n'. Muốn bỏ '\n' thì dùng line.strip() hoặc read().splitlines().","hint":"readlines() có tự động loại bỏ ký tự xuống dòng không?","errorCategory":"implementation","tags":["file-read-methods"],"source":"textbook","reserve":false},{"id":"T6-Q05","topic":"T6","difficulty":2,"type":"output","question":"Đoạn code sau thực hiện lọc dữ liệu số. Kết quả là gì?","code":"s = \"PTIT 2024 Python 3.11\"\ntokens = s.split()\nnums = [t for t in tokens if t.isdigit()]\nprint(\"-\".join(nums))","options":["2024-3.11","Lỗi ValueError","2024-3","2024"],"answer":3,"explanation":"Phương thức isdigit() chỉ trả về True nếu tất cả ký tự là chữ số. '3.11' chứa dấu chấm nên isdigit() trả về False. Chỉ '2024' thỏa mãn.","hint":"Dấu chấm trong '3.11' có phải là chữ số không?","errorCategory":"logic","tags":["split-parse","isdigit-filter"],"source":"supplement","reserve":false},{"id":"T6-Q06","topic":"T6","difficulty":2,"type":"output","question":"Thứ tự in ra của đoạn code sau là gì?","code":"def test_flow():\n    try:\n        print(\"A\", end=\"\")\n        res = 10 / 0\n    except ZeroDivisionError:\n        print(\"B\", end=\"\")\n    else:\n        print(\"C\", end=\"\")\n    finally:\n        print(\"D\", end=\"\")\n\ntest_flow()","options":["AD","ABCD","ABD","ACD"],"answer":2,"explanation":"Thứ tự: try chạy (in A) -> lỗi xảy ra -> except chạy (in B) -> else bị bỏ qua vì có lỗi -> finally luôn chạy (in D). Kết quả ABD.","hint":"Khối else chạy khi nào? Khối finally chạy khi nào?","errorCategory":"execution","tags":["else-finally","try-except"],"source":"textbook","reserve":false},{"id":"T6-Q07","topic":"T6","difficulty":1,"type":"output","question":"Kết quả của đoạn code sau là gì?","code":"my_dict = {\"name\": \"Học viện\", \"year\": 1953}\ntry:\n    print(my_dict[\"location\"])\nexcept KeyError:\n    print(\"Lỗi Key\")\nexcept Exception:\n    print(\"Lỗi chung\")","options":["None","KeyError","Lỗi chung","Lỗi Key"],"answer":3,"explanation":"Truy cập key không tồn tại trong dictionary gây ra KeyError. Python sẽ kiểm tra các khối except từ trên xuống, KeyError khớp đầu tiên nên in 'Lỗi Key'.","hint":"Exception nào cụ thể hơn sẽ được bắt trước?","errorCategory":"execution","tags":["exception-types","try-except"],"source":"textbook","reserve":false},{"id":"T6-Q08","topic":"T6","difficulty":3,"type":"output","question":"Hàm sau trả về giá trị bao nhiêu?","code":"def calculate():\n    try:\n        return 1\n    except:\n        return 2\n    finally:\n        return 3\n\nprint(calculate())","options":["1","2","3","Lỗi SyntaxError"],"answer":2,"explanation":"Đây là một bẫy trong Python: Nếu khối finally có lệnh return, nó sẽ ghi đè lên bất kỳ lệnh return nào đã thực hiện trong try hoặc except trước đó.","hint":"Khối finally có mức độ ưu tiên như thế nào với lệnh return?","errorCategory":"edge","tags":["else-finally"],"source":"supplement","reserve":false},{"id":"T6-Q09","topic":"T6","difficulty":2,"type":"compare","question":"Sự khác biệt chính giữa read() và readlines() là gì?","code":"","options":["Không có sự khác biệt, cả hai đều trả về list các ký tự.","read() đọc từng dòng, readlines() đọc cả file.","read() tự động đóng file, readlines() thì không.","read() trả về string, readlines() trả về list."],"answer":3,"explanation":"read() đọc toàn bộ nội dung file (hoặc n ký tự) trả về một chuỗi duy nhất. readlines() đọc toàn bộ file và tách thành danh sách các chuỗi, mỗi chuỗi là một dòng.","hint":"Kiểu dữ liệu trả về của mỗi hàm là gì?","errorCategory":"method","tags":["file-read-methods"],"source":"textbook","reserve":false},{"id":"T6-Q10","topic":"T6","difficulty":2,"type":"output","question":"Đoạn code xử lý JSON sau in ra gì?","code":"import json\n\ndata_str = '{\"code\": \"IT1\", \"active\": true, \"note\": null}'\ndata = json.loads(data_str)\nprint(f\"{type(data['active'])}-{data['note']}\")","options":["<class 'str'>-None","<class 'str'>-null","<class 'bool'>-null","<class 'bool'>-None"],"answer":3,"explanation":"json.loads chuyển đổi các kiểu dữ liệu JSON sang Python: true thành True (bool), null thành None (NoneType).","hint":"Kiểu null và true trong JSON tương ứng với gì trong Python?","errorCategory":"concept","tags":["json"],"source":"textbook","reserve":false},{"id":"T6-Q11","topic":"T6","difficulty":3,"type":"error","question":"Đoạn code sau sẽ phát sinh lỗi gì?","code":"try:\n    with open(\"non_existent_file.txt\", \"r\") as f:\n        content = f.read()\nexcept ValueError:\n    print(\"V-Error\")","options":["Không in gì và không lỗi","V-Error","NameError","FileNotFoundError"],"answer":3,"explanation":"Mở file không tồn tại ở chế độ 'r' gây lỗi FileNotFoundError. Vì khối except chỉ bắt ValueError, lỗi này không được xử lý và sẽ làm chương trình dừng lại, hiển thị tên exception.","hint":"Exception xảy ra có khớp với loại được liệt kê trong except không?","errorCategory":"execution","tags":["exception-types","file-open-modes"],"source":"textbook","reserve":false},{"id":"T6-Q12","topic":"T6","difficulty":3,"type":"output","question":"Kết quả của đoạn code phức hợp sau là gì?","code":"import io\n\ndef process():\n    f = io.StringIO(\"1\\n2\\n3\")\n    try:\n        lines = f.readlines()\n        return int(lines[3])\n    except IndexError:\n        return \"Idx\"\n    except ValueError:\n        return \"Val\"\n    finally:\n        print(\"Done\", end=\" \")\n\nprint(process())","options":["Done Val","Idx Done","Done Idx","Lỗi IndexError"],"answer":2,"explanation":"Hàm readlines() trả về list 3 phần tử (index 0,1,2). Truy cập lines[3] gây IndexError. Khối finally chạy trước (in 'Done '), sau đó return 'Idx' được thực hiện.","hint":"Khi có return trong except, finally chạy lúc nào?","errorCategory":"execution","tags":["else-finally","exception-types"],"source":"exam","reserve":false},{"id":"T6-Q13","topic":"T6","difficulty":1,"type":"output","question":"Kết quả của đoạn code sau là gì?","code":"try:\n    x = 10 + \"20\"\nexcept TypeError:\n    print(\"T\", end=\"\")\nexcept Exception:\n    print(\"E\", end=\"\")\nelse:\n    print(\"L\", end=\"\")","options":["L","E","TL","T"],"answer":3,"explanation":"Cộng int và str gây TypeError. Khối except đầu tiên bắt được lỗi nên in 'T'. Khối else chỉ chạy khi KHÔNG có exception nào xảy ra.","hint":"Khối else có chạy khi có lỗi đã được xử lý không?","errorCategory":"execution","tags":["exception-types","try-except"],"source":"textbook","reserve":false},{"id":"T6-Q14","topic":"T6","difficulty":2,"type":"compare","question":"Trong thư viện json, sự khác biệt giữa json.dump() và json.dumps() là gì?","code":"","options":["dump() dùng cho string, dumps() dùng cho file.","dumps() an toàn hơn dump() vì nó mã hóa UTF-8.","dump() ghi dữ liệu trực tiếp vào file object, dumps() trả về một chuỗi JSON.","Không có sự khác biệt, chúng là bí danh của nhau."],"answer":2,"explanation":"'dump' (không có s) dùng để ghi vào một 'file-like object'. 'dumps' (có s - string) dùng để tạo ra một chuỗi đại diện cho đối tượng JSON.","hint":"Ký tự 's' trong 'dumps' đại diện cho từ gì?","errorCategory":"method","tags":["json"],"source":"textbook","reserve":false},{"id":"T6-Q15","topic":"T6","difficulty":3,"type":"output","question":"Đoạn code xử lý chuỗi mô phỏng dòng file sau in ra gì?","code":"line = \"  123, 456, 789  \\n\"\nparts = [p.strip() for p in line.split(\",\")]\nprint(\":\".join(parts))","options":["Lỗi AttributeError","  123: 456: 789  ","123: 456: 789","123:456:789"],"answer":3,"explanation":"split(',') chia chuỗi thành ['  123', ' 456', ' 789  \\n']. List comprehension chạy strip() trên từng phần tử sẽ loại bỏ mọi khoảng trắng và ký tự xuống dòng ở hai đầu, còn lại ['123', '456', '789']. join(':') nối lại thành '123:456:789'.","hint":"strip() loại bỏ khoảng trắng ở đâu trong chuỗi?","errorCategory":"logic","tags":["split-parse"],"source":"exam","reserve":false},{"id":"T6-Q16","topic":"T6","difficulty":1,"type":"output","question":"(Dự phòng) Kết quả của đoạn code sau là gì?","code":"lst = [1, 2]\ntry:\n    print(lst[2])\nexcept IndexError as e:\n    print(\"Error\")","options":["2","Error","None","Lỗi chương trình dừng"],"answer":1,"explanation":"Danh sách có 2 phần tử nên chỉ số tối đa là 1. Truy cập lst[2] gây IndexError và được bắt bởi khối except, in ra 'Error'.","hint":"Chỉ số trong Python bắt đầu từ mấy?","errorCategory":"execution","tags":["exception-types"],"source":"textbook","reserve":true},{"id":"T6-Q17","topic":"T6","difficulty":2,"type":"output","question":"(Dự phòng) Kết quả in ra là gì?","code":"d = {\"a\": 1}\ntry:\n    val = d[\"b\"]\nexcept KeyError:\n    val = 0\nfinally:\n    val += 5\nprint(val)","options":["5","1","0","Lỗi NameError"],"answer":0,"explanation":"d['b'] gây KeyError -> khối except chạy gán val = 0 -> khối finally chạy cộng thêm 5 -> val = 5.","hint":"Biến val có tồn tại sau khi thoát khỏi khối except không?","errorCategory":"execution","tags":["else-finally","exception-types"],"source":"supplement","reserve":true},{"id":"T6-Q18","topic":"T6","difficulty":2,"type":"output","question":"(Dự phòng) Đoạn code JSON sau in ra gì?","code":"import json\nd = {\"name\": \"SV\", \"gpa\": 3.2}\ns = json.dumps(d)\nprint(\"gpa\" in s)","options":["Lỗi TypeError","False","3.2","True"],"answer":3,"explanation":"json.dumps(d) trả về một chuỗi (string) có nội dung '{\"name\": \"SV\", \"gpa\": 3.2}'. Phép toán 'in' trên chuỗi kiểm tra xem con 'gpa' có tồn tại không. Kết quả là True.","hint":"Kết quả của dumps() là kiểu dữ liệu gì?","errorCategory":"concept","tags":["json"],"source":"textbook","reserve":true},{"id":"T6-Q19","topic":"T6","difficulty":3,"type":"output","question":"(Dự phòng) Lệnh raise trong đoạn code sau dẫn đến kết quả gì?","code":"def check(n):\n    try:\n        if n < 0: raise ValueError(\"Neg\")\n        return n\n    except ValueError:\n        return \"Error\"\n\nprint(check(-5))","options":["-5","Neg","ValueError","Error"],"answer":3,"explanation":"Khi n = -5, điều kiện n < 0 đúng, raise ValueError được thực thi. Exception này ngay lập tức được bắt bởi khối except cùng cấp, trả về chuỗi 'Error'.","hint":"Lệnh raise dùng để làm gì?","errorCategory":"execution","tags":["try-except"],"source":"supplement","reserve":true},{"id":"T6-Q20","topic":"T6","difficulty":3,"type":"output","question":"(Dự phòng) Cho mô phỏng đọc file sau. Kết quả in ra là gì?","code":"import io\nf = io.StringIO(\"ABCDE\")\npart1 = f.read(2)\npart2 = f.read(2)\nprint(part1 + \"-\" + part2)","options":["AB-CD","AB-BC","ABC-DE","AB-AB"],"answer":0,"explanation":"Đối tượng file giữ một con trỏ vị trí. f.read(2) đọc 2 ký tự đầu ('AB'), con trỏ dịch đến vị trí sau 'B'. Lệnh f.read(2) tiếp theo đọc 2 ký tự kế tiếp từ vị trí hiện tại ('CD'). Kết quả 'AB-CD'.","hint":"Con trỏ file thay đổi như thế nào sau mỗi lần read()?","errorCategory":"execution","tags":["file-read-methods"],"source":"supplement","reserve":true},{"id":"T6-Q21","topic":"T6","difficulty":1,"type":"output","question":"Đoạn code sau mô phỏng việc đọc file và xử lý chuỗi. Kết quả in ra là gì?","code":"content = \"Lập trình\\nPython PTIT\\n2024\"\nlines = content.splitlines()\nwords = lines[1].split()\nprint(f\"{words[0]}-{len(words)}\")","options":["Lập-1","PTIT-2","Python-3","Python-2"],"answer":3,"explanation":"content.splitlines() chia chuỗi thành list các dòng: ['Lập trình', 'Python PTIT', '2024']. lines[1] là 'Python PTIT'. split() mặc định tách theo khoảng trắng tạo thành ['Python', 'PTIT']. words[0] là 'Python' và độ dài list words là 2.","hint":"Chú ý chỉ số index trong Python bắt đầu từ 0.","errorCategory":"execution","tags":["split-parse"],"source":"textbook","reserve":false},{"id":"T6-Q22","topic":"T6","difficulty":1,"type":"output","question":"Chương trình sau xử lý ngoại lệ khi chuyển đổi dữ liệu. Kết quả in ra là gì?","code":"data = [\"10\", \"20.5\", \"30\"]\ntotal = 0\nfor item in data:\n    try:\n        total += int(item)\n    except ValueError:\n        total += 0\nprint(total)","options":["30","60","40","ValueError"],"answer":2,"explanation":"Vòng lặp duyệt qua các phần tử. int(\"10\") = 10. int(\"20.5\") gây ra ValueError vì chuỗi chứa dấu chấm (không phải số nguyên), rơi vào block except cộng thêm 0. int(\"30\") = 30. Tổng là 10 + 0 + 30 = 40.","hint":"Hàm int() chỉ chuyển đổi được các chuỗi biểu diễn số nguyên chính xác.","errorCategory":"logic","tags":["try-except","exception-types"],"source":"exam","reserve":false},{"id":"T6-Q23","topic":"T6","difficulty":3,"type":"output","question":"Thứ tự thực thi của finally và return trong hàm sau như thế nào?","code":"def check_div(a, b):\n    try:\n        return a // b\n    except ZeroDivisionError:\n        return \"Inf\"\n    finally:\n        print(\"End\", end=\" \")\n\nprint(check_div(10, 2))","options":["End 5","5 End","5","End Inf"],"answer":0,"explanation":"Trong Python, khối finally luôn luôn được thực thi trước khi hàm thực sự trả về kết quả từ khối try hoặc except. Do đó, 'End ' được in ra trước, sau đó giá trị 5 (kết quả của 10 // 2) mới được in bởi lệnh print bên ngoài.","hint":"Khối finally có độ ưu tiên thực thi rất đặc biệt so với return.","errorCategory":"execution","tags":["else-finally"],"source":"supplement","reserve":false},{"id":"T6-Q24","topic":"T6","difficulty":2,"type":"output","question":"Đoạn code sau sử dụng thư viện json để xử lý dữ liệu. Kết quả in ra là gì?","code":"import json\nraw = '{\"code\": \"IT1\", \"scores\": [8, 9, 7]}'\ndata = json.loads(raw)\nres = sum(data[\"scores\"]) / len(data[\"scores\"])\nprint(f\"{data['code']}:{res:.1f}\")","options":["IT1:8","KeyError","IT1:8.0","IT1:24.0"],"answer":2,"explanation":"json.loads() chuyển chuỗi JSON thành dictionary. data['scores'] là list [8, 9, 7]. Tổng là 24, độ dài là 3. Trung bình là 8.0. Định dạng .1f in ra 1 chữ số thập phân.","hint":"Kiểm tra kiểu dữ liệu của data['scores'] sau khi loads.","errorCategory":"concept","tags":["json"],"source":"textbook","reserve":false},{"id":"T6-Q25","topic":"T6","difficulty":2,"type":"output","question":"Trong xử lý file, bẫy nào xảy ra khi lọc dữ liệu số bằng isdigit()?","code":"line = \"100 -20 30.5 40\\n\"\ntokens = line.split()\nnums = [t for t in tokens if t.isdigit()]\nprint(\"-\".join(nums))","options":["100-40","100--20-30.5-40","100-30.5-40","100-20-40"],"answer":0,"explanation":"Phương thức isdigit() chỉ trả về True nếu tất cả ký tự là chữ số. '-20' có dấu âm và '30.5' có dấu chấm nên isdigit() trả về False cho hai chuỗi này. Chỉ '100' và '40' được giữ lại.","hint":"isdigit() có nhận diện được số âm hay số thực không?","errorCategory":"concept","tags":["isdigit-filter","split-parse"],"source":"exam","reserve":true},{"id":"T6-Q26","topic":"T6","difficulty":2,"type":"output","question":"Lỗi nào phát sinh khi truy cập dictionary trong đoạn code sau?","code":"rates = {\"USD\": 25000, \"EUR\": 27000}\ntry:\n    curr = \"JPY\"\n    print(rates[curr])\nexcept ValueError:\n    print(\"V-Error\")\nexcept KeyError:\n    print(\"K-Error\")","options":["K-Error","None","V-Error","KeyError"],"answer":0,"explanation":"Khi truy cập một key không tồn tại trong dictionary bằng cú pháp d[key], Python sẽ ném ra ngoại lệ KeyError. Vì có khối except KeyError, chương trình in ra 'K-Error'.","hint":"Sự khác biệt giữa lỗi giá trị (ValueError) và lỗi không tìm thấy khóa (KeyError).","errorCategory":"execution","tags":["exception-types","try-except"],"source":"exam","reserve":false},{"id":"T6-Q27","topic":"T6","difficulty":3,"type":"output","question":"Khối else trong cấu trúc try-except sẽ thực thi khi nào?","code":"def process(n):\n    try:\n        res = 10 / n\n    except ZeroDivisionError:\n        print(\"Err\", end=\" \")\n    else:\n        print(\"Ok\", end=\" \")\n    finally:\n        print(\"Done\")\n\nprocess(2)","options":["Err Done","Ok Done","Done","Ok"],"answer":1,"explanation":"Khối else thực thi nếu và chỉ nếu khối try KHÔNG phát sinh ngoại lệ. Ở đây 10/2 thành công, nên in 'Ok ', sau đó finally luôn chạy in 'Done'.","hint":"Phân biệt vai trò của else và finally.","errorCategory":"theory","tags":["else-finally","try-except"],"source":"supplement","reserve":false},{"id":"T6-Q28","topic":"T6","difficulty":2,"type":"output","question":"Điều gì xảy ra khi đọc file bằng readlines() và in ra kết quả?","code":"content = \"Line1\\nLine2\\nLine3\"\n# Gia su day la noi dung file\nlines = content.splitlines(keepends=True)\nfor line in lines[:2]:\n    print(line, end=\"\")","options":["Line1\nLine2","Line1\nLine2\n","Line1Line2","Line1 Line2"],"answer":0,"explanation":"readlines() giữ lại ký tự xuống dòng \\n ở cuối mỗi dòng. splitlines(keepends=True) mô phỏng điều này. Khi print(line, end=''), ký tự \\n trong line sẽ làm con trỏ xuống dòng. Kết quả là Line1 và Line2 nằm trên 2 dòng.","hint":"Lưu ý ký tự \\n ở cuối dòng khi dùng các phương thức đọc file theo dòng.","errorCategory":"execution","tags":["file-read-methods"],"source":"textbook","reserve":false},{"id":"T6-Q29","topic":"T6","difficulty":1,"type":"output","question":"Kết quả của đoạn code xử lý chuỗi mô phỏng dữ liệu file này là gì?","code":"s = \"  apple   orange  banana  \"\nitems = s.strip().split()\nprint(\"*\".join(items))","options":["apple***orange**banana","apple*orange*banana","*apple*orange*banana*","apple orange banana"],"answer":1,"explanation":"s.strip() loại bỏ khoảng trắng thừa ở hai đầu. split() không tham số sẽ coi mọi cụm khoảng trắng liên tiếp là một dấu phân cách duy nhất. Do đó items = ['apple', 'orange', 'banana']. join('*') nối chúng lại.","hint":"Hành vi mặc định của split() khi có nhiều khoảng trắng liên tiếp.","errorCategory":"concept","tags":["split-parse"],"source":"textbook","reserve":false},{"id":"T6-Q30","topic":"T6","difficulty":2,"type":"output","question":"Chương trình sẽ in ra gì khi cố tình gây lỗi TypeError?","code":"try:\n    res = \"Age: \" + 20\nexcept TypeError:\n    print(\"T-Error\")\nexcept Exception:\n    print(\"Gen-Error\")","options":["Age: 20","Gen-Error","T-Error","TypeError"],"answer":2,"explanation":"Phép cộng giữa chuỗi (str) và số (int) gây ra TypeError. Vì TypeError được liệt kê trước Exception (lớp cha), nó sẽ bắt được lỗi này trước.","hint":"Thứ tự của các khối except và kiểu dữ liệu của các toán hạng.","errorCategory":"execution","tags":["exception-types","try-except"],"source":"textbook","reserve":true},{"id":"T6-Q33","topic":"T6","difficulty":2,"type":"replace","question":"Chọn đoạn code điền vào chỗ ___ để in dictionary dưới dạng chuỗi JSON có thụt đầu dòng 4 khoảng trắng.","code":"import json\nstudent = {\"name\": \"Nam\", \"age\": 20}\njson_str = ___\nprint(json_str)","options":["json.loads(student, indent=4)","json.dumps(student, indent=4)","str(student)","json.dump(student, indent=4)"],"answer":1,"explanation":"json.dumps() (có 's') chuyển object thành chuỗi JSON. Tham số indent=4 quy định việc thụt đầu dòng để dễ đọc. json.dump() dùng để ghi thẳng vào file.","hint":"Phân biệt giữa dumps (to string) và dump (to file).","errorCategory":"method","tags":["json"],"source":"textbook","reserve":false,"expect":"{\n    \"name\": \"Nam\",\n    \"age\": 20\n}"},{"id":"T6-Q34","topic":"T6","difficulty":3,"type":"replace","question":"Chọn đoạn code điền vào ___ để bắt được cả hai loại lỗi có thể xảy ra: chia cho 0 hoặc ép kiểu sai.","code":"data = [\"10\", \"0\", \"abc\"]\nfor s in data:\n    try:\n        print(100 / int(s), end=\" \")\n    except ___:\n        print(\"X\", end=\" \")","options":["ZeroDivisionError or ValueError","(ZeroDivisionError, ValueError)","ZeroDivisionError, ValueError","[ZeroDivisionError, ValueError]"],"answer":1,"explanation":"Để bắt nhiều ngoại lệ trong cùng một khối except, ta phải đặt chúng trong một tuple (ngoặc đơn). Nếu không có ngoặc đơn, Python sẽ hiểu nhầm cú pháp gán alias (as).","hint":"Cú pháp bắt nhiều exception trên cùng một dòng.","errorCategory":"syntax","tags":["try-except","exception-types"],"source":"supplement","reserve":false,"expect":"10.0 X X "},{"id":"T6-Q37","topic":"T6","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"try:\n    n = int(\"24.5\")\n    print(\"A\", end=\"\")\nexcept ValueError:\n    print(\"B\", end=\"\")\nelse:\n    print(\"C\", end=\"\")\nfinally:\n    print(\"D\", end=\"\")","options":["BCD","B","BD","ABD"],"answer":2,"explanation":"Hàm int() ném ra ValueError khi nhận chuỗi không phải số nguyên (\"24.5\"). Khối except ValueError được thực thi in 'B'. Khối else chỉ chạy nếu không có exception. Khối finally luôn luôn chạy, in 'D'.","hint":"Lưu ý điều kiện để khối else và finally thực thi.","errorCategory":"execution","tags":["try-except","else-finally","exception-types"],"source":"textbook","reserve":false},{"id":"T6-Q38","topic":"T6","difficulty":2,"type":"output","question":"Giả sử biến `f` mô phỏng một file đang mở. Kết quả in ra là gì?","code":"f = [\"Hoc vien\\n\", \"Cong nghe\\n\", \"Buu chinh\"]\nres = []\nfor line in f:\n    res.append(line.strip().split()[-1])\nprint(\"_\".join(res))","options":["vien\\n_nghe\\n_chinh","Hoc_Cong_Buu","chinh_nghe_vien","vien_nghe_chinh"],"answer":3,"explanation":"Vòng lặp duyệt qua từng dòng. line.strip() loại bỏ dấu xuống dòng. split() tách các từ. [-1] lấy từ cuối cùng của mỗi dòng. Cuối cùng nối lại bằng dấu gạch dưới.","hint":"Hàm strip() loại bỏ khoảng trắng và xuống dòng ở hai đầu, split() tách chuỗi thành danh sách.","errorCategory":"logic","tags":["split-parse","file-read-methods"],"source":"exam","reserve":false},{"id":"T6-Q39","topic":"T6","difficulty":2,"type":"output","question":"Chương trình sau in ra kết quả gì?","code":"import json\ns = '{\"mon\": \"Python\", \"tin_chi\": 3}'\ntry:\n    data = json.loads(s)\n    print(data[\"Tin_chi\"])\nexcept KeyError:\n    print(\"Loi Key\")\nexcept json.JSONDecodeError:\n    print(\"Loi JSON\")","options":["Loi JSON","KeyError","3","Loi Key"],"answer":3,"explanation":"Hàm json.loads biến chuỗi thành dictionary. Dictionary trong Python phân biệt chữ hoa chữ thường. Truy cập 'Tin_chi' trong khi key thực tế là 'tin_chi' gây ra KeyError.","hint":"Kiểm tra sự khớp nhau giữa các phím (keys) trong dữ liệu JSON và mã nguồn.","errorCategory":"concept","tags":["json","exception-types"],"source":"textbook","reserve":false},{"id":"T6-Q40","topic":"T6","difficulty":3,"type":"output","question":"Chương trình sau thực hiện lọc dữ liệu từ file. Kết quả in ra là gì?","code":"data = \"20 15A 10\\n30 error 5\"\ntokens = data.split()\ns_val = 0\nfor t in tokens:\n    try:\n        if t.isdigit():\n            s_val += int(t)\n        elif len(t) > 3:\n            raise ValueError\n    except ValueError:\n        s_val += 1\nprint(s_val)","options":["70","67","65","66"],"answer":3,"explanation":"Các số isdigit() gồm 20, 10, 30, 5 (tổng 65). Chuỗi '15A' có len=3 nên không thỏa isdigit cũng không thỏa len > 3. Chuỗi 'error' có len=5 > 3 nên raise ValueError, khối except thực thi cộng thêm 1 vào s_val. Tổng cuối = 65 + 1 = 66.","hint":"isdigit() chỉ trả True nếu toàn bộ là chữ số. Kiểm tra kỹ từng token.","errorCategory":"execution","tags":["isdigit-filter","try-except","split-parse"],"source":"supplement","reserve":true},{"id":"T6-Q41","topic":"T6","difficulty":1,"type":"output","question":"Chương trình sau in ra gì khi gặp lỗi chia cho 0?","code":"def divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return \"Zero\"\n    finally:\n        print(\"Done\", end=\" \")\n\nprint(divide(10, 0))","options":["Done","Zero Done","Zero","Done Zero"],"answer":3,"explanation":"Khi có exception, khối except chạy trả về 'Zero'. Tuy nhiên, khối finally luôn chạy trước khi giá trị được trả về thực sự từ hàm. Do đó 'Done' in ra trước, sau đó hàm mới trả về 'Zero' để lệnh print bên ngoài in ra.","hint":"Khối finally thực thi ngay cả khi hàm đã gọi lệnh return.","errorCategory":"execution","tags":["else-finally","try-except"],"source":"textbook","reserve":false},{"id":"T6-Q42","topic":"T6","difficulty":2,"type":"output","question":"Đoạn mã sau xử lý chuỗi mô phỏng file. Kết quả in ra là gì?","code":"text = \"A B C\\n D E \"\nparts = text.split()\nprint(len(parts), end=\" \")\nlines = text.split(\"\\n\")\nprint(len(lines))","options":["6 2","5 3","5 2","3 2"],"answer":2,"explanation":"Hàm split() không đối số sẽ tách theo mọi khoảng trắng (space, newline, tab) và gộp các khoảng trắng liên tiếp, nên 'A B C\\n D E ' có 5 phần tử. split('\\n') chỉ tách theo dấu xuống dòng, tạo ra 2 phần: 'A B C' và ' D E '.","hint":"Sự khác nhau giữa split() và split('\\n') trong việc xử lý khoảng trắng.","errorCategory":"concept","tags":["split-parse"],"source":"supplement","reserve":false},{"id":"T6-Q43","topic":"T6","difficulty":1,"type":"output","question":"Chương trình sẽ in ra gì?","code":"try:\n    f = open(\"non_existent_file.txt\", \"r\")\n    content = f.read()\n    f.close()\nexcept FileNotFoundError:\n    print(\"Error 1\")\nexcept Exception:\n    print(\"Error 2\")","options":["Không in gì","Error 1","Error 2","FileNotFoundError"],"answer":1,"explanation":"Khi mở file không tồn tại ở chế độ 'r', Python ném ra FileNotFoundError. Do except FileNotFoundError đứng trước, nó sẽ bắt được lỗi này.","hint":"Xác định loại ngoại lệ khi thao tác với file không tồn tại.","errorCategory":"theory","tags":["file-open-modes","exception-types"],"source":"textbook","reserve":false},{"id":"T6-Q44","topic":"T6","difficulty":3,"type":"output","question":"Đoạn code sau in ra gì?","code":"data = [1, 0, \"2\"]\nfor x in data:\n    try:\n        print(10 // int(x), end=\" \")\n    except (ValueError, ZeroDivisionError):\n        print(\"E\", end=\" \")","options":["ZeroDivisionError","10 E 5","10 0 5","10 E E"],"answer":1,"explanation":"Vòng lặp 1: int(1)=1, 10//1=10. Vòng lặp 2: int(0)=0, 10//0 gây ZeroDivisionError -> in 'E'. Vòng lặp 3: int(\"2\")=2, 10//2=5. Kết quả: 10 E 5.","hint":"Xử lý nhiều loại ngoại lệ trong cùng một khối except.","errorCategory":"logic","tags":["try-except","exception-types"],"source":"exam","reserve":false},{"id":"T6-Q45","topic":"T6","difficulty":1,"type":"replace","question":"Chọn đoạn code điền vào chỗ ___ để đảm bảo file luôn được đóng sau khi ghi, ngay cả khi có lỗi xảy ra.","code":"data = \"Hello Python\"\n___\n    f.write(data)","options":["with open('out.txt', 'w') as f:","with f = open('out.txt', 'w'):","with open('out.txt', 'w') as f","f = open('out.txt', 'w')"],"answer":0,"explanation":"Cấu trúc 'with' (context manager) tự động gọi phương thức đóng file khi kết thúc khối lệnh, kể cả khi có ngoại lệ.","hint":"Cú pháp quản lý ngữ cảnh phổ biến nhất trong Python cho file.","errorCategory":"syntax","tags":["with-statement","file-open-modes"],"source":"textbook","reserve":true,"expect":""},{"id":"T6-Q46","topic":"T6","difficulty":2,"type":"replace","question":"Chọn đoạn code điền vào ___ để chương trình in ra tổng số dòng của file (giả sử file có nội dung).","code":"f = [\"L1\\n\", \"L2\\n\", \"L3\\n\"]\n# f mo phong file object\ncount = ___\nprint(count)","options":["f.readlines()","f.count()","len(f)","len(f.read())"],"answer":2,"explanation":"Trong Python, một file object là một iterable chứa các dòng. len() của một list các dòng (hoặc đếm vòng lặp) sẽ cho số dòng.","hint":"Duyệt qua file object tương đương với duyệt qua danh sách các dòng.","errorCategory":"method","tags":["file-read-methods"],"source":"exam","reserve":false,"expect":"3"},{"id":"T6-Q47","topic":"T6","difficulty":2,"type":"replace","question":"Dòng ___ ban đầu là `f.write(json.dumps(info))`. Cách nào sau đây thay thế dòng đó mà kết quả ghi vào file tương đương?","code":"import json\ninfo = {\"name\": \"Nam\", \"age\": 20}\nwith open(\"data.json\", \"w\") as f:\n    ___","options":["json.dumps(info, f)","json.dump(info, f)","f.write(json.load(info))","f.json(info)"],"answer":1,"explanation":"json.dump(obj, fp) ghi trực tiếp đối tượng Python vào file object. json.dumps(obj) trả về chuỗi JSON.","hint":"Phân biệt giữa dump (ghi file) và dumps (trả về chuỗi).","errorCategory":"method","tags":["json"],"source":"textbook","reserve":false,"expect":""},{"id":"T7-Q01","topic":"T7","difficulty":1,"type":"theory","question":"Phương thức đặc biệt nào trong Python được gọi tự động khi một đối tượng (instance) của lớp được khởi tạo?","code":"","options":["__init__","__new__","__str__","__main__"],"answer":0,"explanation":"__init__ là constructor trong Python, được tự động gọi ngay sau khi đối tượng được tạo để khởi tạo các thuộc tính.","hint":"Tìm tên phương thức khởi tạo.","errorCategory":"theory","tags":["class-init"],"source":"textbook","reserve":false},{"id":"T7-Q02","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\np = Point(3, 4)\nprint(p.x + p.y)","options":["TypeError","34","7","AttributeError"],"answer":2,"explanation":"p.x có giá trị 3 và p.y có giá trị 4. Phép toán p.x + p.y thực hiện 3 + 4 = 7.","hint":"Cộng hai thuộc tính x và y của đối tượng p.","errorCategory":"execution","tags":["self-attributes"],"source":"textbook","reserve":false},{"id":"T7-Q03","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Dog:\n    def __init__(self, name):\n        self.name = name\nd = Dog(\"Buddy\")\nprint(d.name)","options":["Dog","None","Buddy","TypeError"],"answer":2,"explanation":"Đối tượng d được khởi tạo với name là \"Buddy\", câu lệnh print(d.name) in ra \"Buddy\".","hint":"Xem giá trị được truyền vào thuộc tính name.","errorCategory":"execution","tags":["class-init"],"source":"textbook","reserve":false},{"id":"T7-Q04","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Cat:\n    def __init__(self, name):\n        self.name = name\n    def __str__(self):\n        return f\"Cat: {self.name}\"\nc = Cat(\"Miu\")\nprint(c)","options":["<__main__.Cat object>","TypeError","Miu","Cat: Miu"],"answer":3,"explanation":"Hàm print() gọi phương thức __str__ của đối tượng. Phương thức này trả về chuỗi \"Cat: Miu\".","hint":"Phương thức __str__ định nghĩa cách hiển thị đối tượng khi in.","errorCategory":"execution","tags":["str-method"],"source":"textbook","reserve":false},{"id":"T7-Q05","topic":"T7","difficulty":1,"type":"error","question":"Đoạn code sau gây ra lỗi gì khi thực thi và tại sao?","code":"class Person:\n    def __init__(name):\n        self.name = name\np = Person(\"An\")","options":["NameError: name 'self' is not defined","AttributeError: 'Person' object has no attribute 'name'","TypeError: __init__() takes 1 positional argument but 2 were given","TypeError: Person() takes no arguments"],"answer":2,"explanation":"Khi gọi Person(\"An\"), Python tự truyền đối tượng mới làm đối số đầu tiên, nên __init__ nhận 2 đối số (đối tượng và \"An\") trong khi chỉ khai báo 1 tham số → TypeError ngay khi gọi, chưa chạy tới dòng self.name (nên không phải NameError). Cách đúng: def __init__(self, name).","hint":"Kiểm tra danh sách tham số của hàm __init__.","errorCategory":"syntax","tags":["self-attributes"],"source":"textbook","reserve":false},{"id":"T7-Q06","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class MathBox:\n    def __init__(self, val):\n        self.val = val\n    def double(self):\n        return self.val * 2\nm = MathBox(5)\nprint(m.double())","options":["5","25","10","TypeError"],"answer":2,"explanation":"m.val được gán bằng 5. Phương thức double() trả về val * 2 = 10.","hint":"Phương thức double nhân đôi giá trị của thuộc tính val.","errorCategory":"execution","tags":["methods"],"source":"textbook","reserve":false},{"id":"T7-Q07","topic":"T7","difficulty":2,"type":"compare","question":"Điểm khác biệt quan trọng nhất giữa thuộc tính lớp (class attribute) và thuộc tính đối tượng (instance attribute) là gì?","code":"","options":["Thuộc tính lớp được chia sẻ chung bởi tất cả các đối tượng thuộc lớp đó, trong khi thuộc tính đối tượng là riêng biệt cho từng instance.","Thuộc tính lớp chỉ tồn tại bên trong hàm __init__(), còn thuộc tính đối tượng nằm ngoài các phương thức.","Thuộc tính đối tượng không thể thay đổi giá trị sau khi khởi tạo, còn thuộc tính lớp thì có thể.","Không có sự khác biệt về bản chất, chúng chỉ khác nhau về tên gọi trong Python."],"answer":0,"explanation":"Thuộc tính lớp được định nghĩa trực tiếp trong body của class và chia sẻ chung cho mọi instance, còn thuộc tính đối tượng được gắn với `self` trong phương thức (thường là `__init__`) và mang giá trị riêng cho từng đối tượng.","hint":"Xem xét phạm vi chia sẻ dữ liệu của thuộc tính.","errorCategory":"concept","tags":["instance-vs-class-attr"],"source":"textbook","reserve":false},{"id":"T7-Q08","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return \"Some sound\"\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\nd = Dog(\"Rex\")\nprint(d.name, d.speak())","options":["Rex Some sound","None Woof","Rex Woof","TypeError"],"answer":2,"explanation":"Dog kế thừa Animal, lấy name là 'Rex'. Phương thức speak() bị ghi đè trả về 'Woof'. Kết quả là 'Rex Woof'.","hint":"Phương thức speak() đã được ghi đè ở lớp con Dog.","errorCategory":"execution","tags":["inheritance-super"],"source":"textbook","reserve":false},{"id":"T7-Q09","topic":"T7","difficulty":2,"type":"error","question":"Đoạn code sau gây ra lỗi gì khi thực thi?","code":"class Parent:\n    def __init__(self, name):\n        self.name = name\nclass Child(Parent):\n    def __init__(self, name, age):\n        super().__init__(name)\n        self.age = age\nc = Child(\"An\")","options":["NameError: name 'super' is not defined","AttributeError: 'Child' object has no attribute 'age'","TypeError: __init__() missing 1 required positional argument: 'age'","Không có lỗi, in ra An"],"answer":2,"explanation":"Lớp Child yêu cầu khởi tạo 2 tham số (name và age), nhưng khi gọi `Child(\"An\")` chỉ truyền 1 tham số, gây TypeError.","hint":"Kiểm tra số lượng tham số truyền vào khi khởi tạo đối tượng Child.","errorCategory":"edge","tags":["inheritance-super"],"source":"textbook","reserve":false},{"id":"T7-Q10","topic":"T7","difficulty":2,"type":"theory","question":"Phát biểu nào sau đây ĐÚNG về việc sử dụng `super().__init__()` trong lớp con (Child class)?","code":"","options":["Chỉ dùng được khi lớp con không có thuộc tính riêng.","Bắt buộc phải gọi trong mọi phương thức của lớp con nếu không sẽ báo lỗi cú pháp.","Dùng để ghi đè hoàn toàn thuộc tính của lớp cha mà không cần truyền tham số.","Giúp gọi phương thức khởi tạo của lớp cha để kế thừa và tái sử dụng các thuộc tính đã được định nghĩa ở lớp cha."],"answer":3,"explanation":"super().__init__() dùng để gọi constructor của lớp cha từ lớp con, giúp tái tạo các thuộc tính ban đầu mà lớp cha quản lý.","hint":"Vai trò của super() trong hàm khởi tạo lớp con.","errorCategory":"theory","tags":["inheritance-super"],"source":"textbook","reserve":false},{"id":"T7-Q11","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Item:\n    def __init__(self, name, price):\n        self.name = name\n        self.price = price\nitems = [Item(\"A\", 100), Item(\"B\", 50), Item(\"C\", 200)]\ntotal = sum(i.price for i in items)\nprint(total)","options":["TypeError","150","350.0","350"],"answer":3,"explanation":"Tổng giá trị price của các Item là 100 + 50 + 200 = 350.","hint":"Dùng generator expression kết hợp với sum() để tính tổng.","errorCategory":"execution","tags":["list-of-objects"],"source":"textbook","reserve":false},{"id":"T7-Q12","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Student:\n    def __init__(self, name, gpa):\n        self.name = name\n        self.gpa = gpa\nstudents = [Student(\"Nam\", 3.2), Student(\"An\", 3.8), Student(\"Binh\", 3.2)]\nsorted_sts = sorted(students, key=lambda s: (s.gpa, s.name))\nprint([s.name for s in sorted_sts])","options":["['Binh', 'Nam', 'An']","['An', 'Binh', 'Nam']","['Nam', 'Binh', 'An']","['An', 'Nam', 'Binh']"],"answer":0,"explanation":"Sắp xếp tăng dần theo gpa, nếu gpa bằng nhau thì sắp xếp theo name. Gpa 3.2 gồm Binh và Nam, sắp xếp theo tên là 'Binh' rồi 'Nam'. An (3.8) đứng cuối. Kết quả: ['Binh', 'Nam', 'An'].","hint":"Key sắp xếp là tuple (gpa, name).","errorCategory":"logic","tags":["sort-filter-objects"],"source":"exam","reserve":false},{"id":"T7-Q13","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Circle:\n    pi = 3.14\n    def __init__(self, r):\n        self.r = r\nc1 = Circle(2)\nc2 = Circle(3)\nc1.pi = 3.14159\nprint(c1.pi, c2.pi, Circle.pi)","options":["3.14159 3.14159 3.14","3.14159 3.14159 3.14159","3.14 3.14 3.14","3.14159 3.14 3.14"],"answer":3,"explanation":"Gán c1.pi = 3.14159 tạo thuộc tính instance mới cho c1, không làm thay đổi class attribute Circle.pi hay c2.pi. Kết quả: 3.14159 3.14 3.14.","hint":"Gán giá trị thông qua instance chỉ tạo thuộc tính cho riêng instance đó.","errorCategory":"concept","tags":["instance-vs-class-attr"],"source":"textbook","reserve":false},{"id":"T7-Q14","topic":"T7","difficulty":2,"type":"error","question":"Đoạn code sau gây ra lỗi gì khi thực thi?","code":"class Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\nemps = [Employee(\"Huy\", 1000), Employee(\"Lan\", 1500)]\nprint(emps.salary)","options":["TypeError: unsupported operand type","AttributeError: 'list' object has no attribute 'salary'","IndexError: list index out of range","KeyError: 'salary'"],"answer":1,"explanation":"emps là danh sách (list), danh sách không có thuộc tính salary, do đó gọi emps.salary gây ra AttributeError.","hint":"emps là list chứa các đối tượng Employee chứ bản thân emps không phải là đối tượng Employee.","errorCategory":"edge","tags":["list-of-objects"],"source":"exam","reserve":false},{"id":"T7-Q15","topic":"T7","difficulty":2,"type":"theory","question":"Trong Python, tham số đầu tiên của một phương thức thông thường (instance method) trong class đại diện cho điều gì?","code":"","options":["Tham chiếu đến đối tượng (instance) hiện tại đang gọi phương thức đó.","Đại diện cho lớp (class) chứa phương thức đó.","Một từ khóa bắt buộc phải đặt tên là 'this' giống như Java.","Biến toàn cục lưu trữ trạng thái của chương trình."],"answer":0,"explanation":"Tham số đầu tiên (thường đặt tên là self) đại diện cho chính đối tượng gọi phương thức, cho phép truy xuất thuộc tính và phương thức khác của đối tượng đó.","hint":"Ý nghĩa của self.","errorCategory":"theory","tags":["methods"],"source":"textbook","reserve":false},{"id":"T7-Q16","topic":"T7","difficulty":3,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class A:\n    def process(self):\n        return \"A\"\nclass B(A):\n    def process(self):\n        return super().process() + \"B\"\nclass C(B):\n    def process(self):\n        return super().process() + \"C\"\nc = C()\nprint(c.process())","options":["CBA","ABC","C","TypeError"],"answer":1,"explanation":"C gọi super().process() (tức B.process()), B gọi super().process() (tức A.process() trả về 'A'). Kết quả chuỗi nối thành 'ABC'.","hint":"Theo dõi chuỗi gọi hàm kế thừa ngược lên trên qua super().","errorCategory":"logic","tags":["inheritance-super"],"source":"supplement","reserve":true},{"id":"T7-Q17","topic":"T7","difficulty":3,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Product:\n    def __init__(self, name, price, qty):\n        self.name = name\n        self.price = price\n        self.qty = qty\n    def total_value(self):\n        return self.price * self.qty\nprods = [Product(\"A\", 10, 2), Product(\"C\", 15, 3), Product(\"B\", 20, 3), Product(\"D\", 5, 5)]\nfiltered = [p.name for p in prods if p.total_value() > 40]\nprint(sorted(filtered))","options":["['A', 'B', 'C', 'D']","['B', 'C']","['C', 'B']","['A', 'D']"],"answer":1,"explanation":"Tính total_value: A=20, C=45, B=60, D=25. Điều kiện >40 lọc ra C và B. sorted(['C', 'B']) trả về ['B', 'C'].","hint":"Tính giá trị total_value cho từng sản phẩm trước khi lọc.","errorCategory":"method","tags":["sort-filter-objects"],"source":"exam","reserve":true},{"id":"T7-Q18","topic":"T7","difficulty":3,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Counter:\n    count = 0\n    def __init__(self):\n        Counter.count += 1\nc1 = Counter()\nc2 = Counter()\nc3 = Counter()\nprint(Counter.count, c1.count)","options":["3 3","3 1","1 3","3 0"],"answer":0,"explanation":"Mỗi lần khởi tạo đối tượng, Counter.count tăng lên 1, sau 3 lần tạo đối tượng thì Counter.count bằng 3. c1.count truy xuất đến class attribute count, do đó cũng in ra 3.","hint":"Thuộc tính count là thuộc tính lớp, được chia sẻ và truy xuất qua cả class lẫn instance.","errorCategory":"concept","tags":["instance-vs-class-attr"],"source":"supplement","reserve":true},{"id":"T7-Q19","topic":"T7","difficulty":3,"type":"error","question":"Đoạn code sau gặp lỗi gì khi thực thi?","code":"class Parent:\n    def __init__(self, x):\n        self.x = x\nclass Child(Parent):\n    def __init__(self, x, y):\n        self.y = y\nc = Child(1, 2)\nprint(c.x)","options":["AttributeError: 'Child' object has no attribute 'x'","TypeError: __init__() takes 2 positional arguments","In ra 1","NameError: name 'super' is not defined"],"answer":0,"explanation":"Lớp Child ghi đè constructor nhưng không gọi `super().__init__(x)`, do đó thuộc tính `x` không được khởi tạo, dẫn đến AttributeError khi gọi `c.x`.","hint":"Kiểm tra việc gọi constructor lớp cha trong lớp con khi ghi đè __init__.","errorCategory":"implementation","tags":["override"],"source":"supplement","reserve":true},{"id":"T7-Q20","topic":"T7","difficulty":3,"type":"compare","question":"Khác biệt chính giữa phương thức `__str__` và `__repr__` của một class trong Python là gì?","code":"","options":["Không có sự khác biệt nào, Python sử dụng chúng thay thế hoàn toàn cho nhau.","`__repr__` chỉ được gọi khi dùng hàm print(), còn `__str__` dùng khi gọi hàm repr().","`__str__` hướng tới người dùng cuối (dễ đọc, thân thiện), trong khi `__repr__` hướng tới nhà phát triển (chi tiết, mang tính gỡ lỗi/debugging).","`__str__` trả về chuỗi định dạng JSON bắt buộc, còn `__repr__` trả về số nguyên."],"answer":2,"explanation":"__str__ nhằm cung cấp chuỗi thân thiện với người dùng (informal/readable), còn __repr__ nhằm cung cấp biểu diễn chính xác, chi tiết kỹ thuật cho lập trình viên (official/debugging).","hint":"Mục đích sử dụng khác nhau giữa hiển thị thân thiện và hiển thị gỡ lỗi.","errorCategory":"concept","tags":["str-method"],"source":"supplement","reserve":true},{"id":"T7-Q21","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Cat:\n    def __init__(s, n):\n        s.name = n\nc = Cat(\"Mimi\")\nprint(c.name)","options":["Mimi","s.name","AttributeError","TypeError"],"answer":0,"explanation":"Trong Python, tham số đầu tiên của phương thức (thường đặt là self) chỉ là một quy ước đặt tên. Bạn có thể dùng bất kỳ tên biến nào (như 's'), Python vẫn hiểu đó là tham chiếu đến đối tượng hiện tại.","hint":"Tham số đầu tiên của __init__ có bắt buộc phải tên là 'self' không?","errorCategory":"concept","tags":["class-init","self-attributes"],"source":"textbook","reserve":false},{"id":"T7-Q22","topic":"T7","difficulty":2,"type":"output","question":"Giá trị in ra của chương trình là gì?","code":"class A:\n    x = 1\n    def __init__(self):\n        self.x = 2\na = A()\nprint(a.x, A.x)","options":["AttributeError","2 2","2 1","1 1"],"answer":2,"explanation":"A.x là thuộc tính lớp (class attribute) có giá trị 1. a.x là thuộc tính đối tượng (instance attribute) được khởi tạo trong __init__ có giá trị 2. Hai thuộc tính này nằm ở phạm vi khác nhau.","hint":"Phân biệt biến khai báo trực tiếp trong class và biến gán với self.","errorCategory":"execution","tags":["instance-vs-class-attr"],"source":"textbook","reserve":false},{"id":"T7-Q23","topic":"T7","difficulty":1,"type":"output","question":"Chương trình sau sẽ in ra gì?","code":"class Student:\n    pass\ns = Student()\ns.score = 9\nprint(s.age)","options":["0","None","TypeError","AttributeError"],"answer":3,"explanation":"Đối tượng 's' đã được gán thuộc tính 'score', nhưng thuộc tính 'age' chưa bao giờ được định nghĩa hay gán giá trị, do đó Python tung ra lỗi AttributeError khi truy cập.","hint":"Điều gì xảy ra khi gọi một thuộc tính không tồn tại của đối tượng?","errorCategory":"logic","tags":["self-attributes"],"source":"exam","reserve":false},{"id":"T7-Q24","topic":"T7","difficulty":2,"type":"output","question":"Kết quả của đoạn code này là gì?","code":"class Box:\n    def __str__(self):\n        return \"Chiec hop\"\nb = Box()\nprint(b)","options":["TypeError","Box","Chiec hop","<__main__.Box object>"],"answer":2,"explanation":"Phương thức __str__ được gọi tự động khi sử dụng hàm print() hoặc str() trên đối tượng để trả về chuỗi đại diện cho đối tượng đó.","hint":"Phương thức đặc biệt nào điều khiển cách đối tượng hiển thị khi in?","errorCategory":"theory","tags":["str-method"],"source":"textbook","reserve":false},{"id":"T7-Q25","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class P:\n    def f(self): return 10\nclass C(P):\n    def f(self): return super().f() + 5\nobj = C()\nprint(obj.f())","options":["10","RecursionError","15","5"],"answer":2,"explanation":"Lớp C kế thừa P và ghi đè phương thức f. Bên trong f của C, super().f() gọi phương thức f của lớp cha (trả về 10), sau đó cộng thêm 5.","hint":"Hàm super() dùng để làm gì trong kế thừa?","errorCategory":"execution","tags":["inheritance-super","override"],"source":"textbook","reserve":true},{"id":"T7-Q26","topic":"T7","difficulty":3,"type":"output","question":"Đoạn code sau in ra gì?","code":"class Item:\n    def __init__(self, v): self.v = v\nL = [Item(3), Item(1), Item(2)]\nL.sort(key=lambda x: x.v)\nprint(L[0].v)","options":["1","3","2","TypeError"],"answer":0,"explanation":"Danh sách L chứa các đối tượng Item. Phương thức sort với key là lambda lấy thuộc tính 'v' của từng đối tượng để so sánh. Sau khi sắp xếp, Item có v=1 nằm ở đầu danh sách.","hint":"Hàm sort sắp xếp danh sách theo tiêu chí nào qua tham số key?","errorCategory":"method","tags":["list-of-objects","sort-filter-objects"],"source":"exam","reserve":false},{"id":"T7-Q27","topic":"T7","difficulty":2,"type":"output","question":"Chương trình sau phát sinh lỗi gì?","code":"class Dog:\n    def bark():\n        return \"Woof\"\nd = Dog()\nprint(d.bark())","options":["AttributeError","Woof","NameError","TypeError"],"answer":3,"explanation":"Phương thức bark() được định nghĩa không có tham số self. Khi gọi d.bark(), Python tự động truyền đối tượng 'd' vào làm đối số đầu tiên, dẫn đến lỗi TypeError vì hàm không nhận đối số nào.","hint":"Một instance method thông thường cần tham số gì ở vị trí đầu tiên?","errorCategory":"syntax","tags":["methods","self-attributes"],"source":"supplement","reserve":false},{"id":"T7-Q28","topic":"T7","difficulty":3,"type":"output","question":"Kết quả in ra là gì?","code":"class X:\n    v = 0\n    def up(self): self.v += 1\nx = X()\nx.up()\nX.v = 5\nprint(x.v, X.v)","options":["1 0","1 5","6 6","6 5"],"answer":1,"explanation":"Khi x.up() chạy, self.v += 1 tạo ra một instance attribute 'v' cho riêng 'x' (với giá trị 0+1=1). Lệnh X.v = 5 chỉ thay đổi class attribute. x.v hiện tại là instance attribute nên không bị ảnh hưởng bởi thay đổi của class attribute.","hint":"Khi gán giá trị cho self.v, nó trở thành thuộc tính của đối tượng hay của lớp?","errorCategory":"logic","tags":["instance-vs-class-attr"],"source":"textbook","reserve":false},{"id":"T7-Q29","topic":"T7","difficulty":1,"type":"output","question":"Kết quả in ra là gì?","code":"class Sv:\n    def __init__(self, g):\n        self.g = g\nL = [Sv(3.5), Sv(2.0), Sv(3.8)]\nres = [s.g for s in L if s.g >= 3.5]\nprint(len(res))","options":["0","3","2","1"],"answer":2,"explanation":"List comprehension lọc các đối tượng trong L có thuộc tính g >= 3.5. Có hai giá trị thỏa mãn là 3.5 và 3.8.","hint":"Đếm số lượng phần tử thỏa mãn điều kiện g >= 3.5.","errorCategory":"execution","tags":["list-of-objects","sort-filter-objects"],"source":"exam","reserve":false},{"id":"T7-Q30","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra gì?","code":"class Store:\n    items = []\n    def add(self, x): self.items.append(x)\ns1 = Store(); s2 = Store()\ns1.add(\"Apple\")\nprint(len(s2.items))","options":["1","2","0","AttributeError"],"answer":0,"explanation":"Biến 'items' được khai báo ở mức lớp (class attribute) và là một list (kiểu dữ liệu thay đổi được - mutable). Tất cả các đối tượng của Store đều dùng chung danh sách này. Khi s1 thêm phần tử, s2 cũng thấy sự thay đổi đó.","hint":"Biến items là thuộc tính lớp hay thuộc tính đối tượng?","errorCategory":"logic","tags":["instance-vs-class-attr"],"source":"textbook","reserve":true},{"id":"T7-Q32","topic":"T7","difficulty":2,"type":"replace","question":"Dòng ___ ban đầu là `L.sort(key=lambda p: p.name)`. Đoạn nào thay thế được dòng đó mà kết quả không đổi?","code":"class Person:\n    def __init__(self, name): self.name = name\nL = [Person(\"B\"), Person(\"A\")]\n___\nprint(L[0].name)","options":["L.sort()","L = sorted(L, key=lambda x: x.name)","L.sorted(key=lambda x: x.name)","L = L.sort(key=lambda x: x.name)"],"answer":1,"explanation":"sorted(L) trả về một danh sách mới đã sắp xếp, nên cần gán lại cho L. Phương thức L.sort() trả về None, nên nếu gán L = L.sort() sẽ gây lỗi ở dòng print.","hint":"Hàm nào trả về list mới, phương thức nào thay đổi list tại chỗ?","errorCategory":"method","tags":["sort-filter-objects","list-of-objects"],"source":"exam","reserve":false,"expect":"A"},{"id":"T7-Q35","topic":"T7","difficulty":2,"type":"replace","question":"Chọn đoạn code điền vào chỗ ___ để chương trình in ra: Yes.","code":"class Animal: pass\nclass Dog(Animal): pass\nd = Dog()\nif ___:\n    print(\"Yes\")","options":["d == Animal","isinstance(d, Animal)","isinstance(Animal, d)","type(d) == Animal"],"answer":1,"explanation":"Hàm isinstance(obj, Class) kiểm tra xem một đối tượng có phải là thực thể của lớp đó hoặc lớp con của nó hay không. type(d) == Animal sẽ trả về False vì d thuộc lớp Dog.","hint":"Hàm nào kiểm tra quan hệ giữa đối tượng và lớp (bao gồm cả kế thừa)?","errorCategory":"concept","tags":["inheritance-super"],"source":"supplement","reserve":true,"expect":"Yes"},{"id":"T7-Q37","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Bird:\n    def __init__(name):\n        self.name = name\n\nb = Bird(\"Eagle\")\nprint(b.name)","options":["AttributeError","TypeError","None","Eagle"],"answer":1,"explanation":"Trong Python, phương thức __init__ (và các phương thức instance khác) bắt buộc phải có tham số đầu tiên đại diện cho thực thể (thường đặt tên là self). Khi Bird(\"Eagle\") được gọi, Python truyền 2 đối số (thực thể mới và chuỗi \"Eagle\") vào hàm chỉ nhận 1 tham số (name), gây ra lỗi TypeError.","hint":"Hãy đếm số lượng tham số mà hàm __init__ đang khai báo và số lượng đối số thực tế Python truyền vào.","errorCategory":"syntax","tags":["class-init"],"source":"textbook","reserve":false},{"id":"T7-Q38","topic":"T7","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"class Counter:\n    count = 0\n    def __init__(self):\n        self.count += 1\n\nc1 = Counter()\nc2 = Counter()\nprint(Counter.count, c1.count)","options":["1 1","2 2","0 1","0 0"],"answer":2,"explanation":"Counter.count là thuộc tính lớp (class attribute), khởi tạo bằng 0. Khi self.count += 1 thực hiện, Python tạo ra một thuộc tính thực thể (instance attribute) cho riêng c1 dựa trên giá trị của lớp, nhưng không làm thay đổi giá trị gốc của lớp Counter.count.","hint":"Phân biệt giữa biến thuộc về lớp (class variable) và biến thuộc về đối tượng (instance variable).","errorCategory":"concept","tags":["instance-vs-class-attr"],"source":"textbook","reserve":false},{"id":"T7-Q39","topic":"T7","difficulty":3,"type":"output","question":"Kết quả của chương trình sau là gì?","code":"class Room:\n    items = []\n    def add(self, x): self.items.append(x)\n\nr1 = Room()\nr1.add(\"Chair\")\nr2 = Room()\nr2.add(\"Table\")\nprint(r1.items)","options":["['Chair', 'Table']","[]","['Table']","['Chair']"],"answer":0,"explanation":"Vì 'items' được khai báo là một list trực tiếp trong class (không nằm trong __init__), nó trở thành một class attribute kiểu mutable. Tất cả các thực thể của Room sẽ chia sẻ chung danh sách này. Khi r2 thêm 'Table', r1 cũng thấy sự thay đổi đó.","hint":"Các kiểu dữ liệu thay đổi được (mutable) như list khi dùng làm thuộc tính lớp sẽ được dùng chung bởi mọi đối tượng.","errorCategory":"logic","tags":["instance-vs-class-attr"],"source":"supplement","reserve":false},{"id":"T7-Q40","topic":"T7","difficulty":3,"type":"output","question":"Đoạn code sau in ra gì?","code":"class Base:\n    def __init__(self):\n        self.v = 10\nclass Sub(Base):\n    def __init__(self):\n        self.x = 20\ns = Sub()\nprint(s.v + s.x)","options":["30","TypeError","AttributeError","10"],"answer":2,"explanation":"Trong Python, nếu lớp con định nghĩa phương thức __init__, nó sẽ ghi đè hoàn toàn phương thức __init__ của lớp cha. Vì Sub không gọi super().__init__(), thuộc tính 'v' không bao giờ được tạo ra cho đối tượng 's', dẫn đến lỗi AttributeError khi truy cập s.v.","hint":"Kiểm tra xem phương thức khởi tạo của lớp cha có được thực thi hay không.","errorCategory":"execution","tags":["inheritance-super"],"source":"textbook","reserve":true},{"id":"T7-Q41","topic":"T7","difficulty":2,"type":"output","question":"Giá trị in ra là gì?","code":"class Parent:\n    def call(self): return \"P\"\nclass Child(Parent):\n    def call(self): return super().call() + \"C\"\n\nc = Child()\nprint(c.call())","options":["P","CP","PC","C"],"answer":2,"explanation":"Phương thức call() của Child ghi đè Parent. Tuy nhiên, nó sử dụng super().call() để lấy kết quả từ lớp cha (\"P\") rồi nối thêm chuỗi \"C\". Kết quả cuối cùng là \"PC\".","hint":"Hàm super() cho phép gọi phương thức đã bị ghi đè từ lớp cha.","errorCategory":"concept","tags":["inheritance-super","override"],"source":"textbook","reserve":false},{"id":"T7-Q42","topic":"T7","difficulty":2,"type":"output","question":"Kết quả in ra là gì?","code":"class A: pass\nclass B(A): pass\nclass C(B): pass\nobj = C()\nprint(isinstance(obj, A), isinstance(obj, B))","options":["False True","False False","True False","True True"],"answer":3,"explanation":"isinstance() trả về True nếu đối tượng là thực thể của lớp đó hoặc của bất kỳ lớp cha nào của nó. Vì C kế thừa từ B, và B kế thừa từ A, nên một đối tượng lớp C cũng được coi là thực thể của B và A.","hint":"Tính chất đa hình và quan hệ 'is-a' trong kế thừa nhiều cấp.","errorCategory":"theory","tags":["inheritance-super"],"source":"textbook","reserve":false},{"id":"T7-Q43","topic":"T7","difficulty":2,"type":"output","question":"Đoạn code sau in ra gì?","code":"class Point:\n    def __init__(self, x): self.x = x\npts = [Point(1), Point(2), Point(3)]\nres = [p.x for p in pts if p.x % 2 != 0]\nprint(res)","options":["AttributeError","[1, 3]","[2]","[1, 2, 3]"],"answer":1,"explanation":"Đây là kỹ thuật list comprehension áp dụng lên danh sách đối tượng. Nó lọc ra các đối tượng có thuộc tính x là số lẻ và tạo ra danh sách chứa giá trị x của chúng.","hint":"Duyệt qua từng đối tượng trong danh sách và kiểm tra điều kiện của thuộc tính x.","errorCategory":"logic","tags":["list-of-objects"],"source":"exam","reserve":false},{"id":"T7-Q45","topic":"T7","difficulty":1,"type":"replace","question":"Chọn đoạn code điền vào ___ để chương trình khởi tạo thành công thuộc tính 'brand' cho đối tượng.","code":"class Car:\n    ___\n        self.brand = brand\n\nc = Car(\"Toyota\")\nprint(c.brand)","options":["def __init__(brand):","def create(self, brand):","def Car(self, brand):","def __init__(self, brand):"],"answer":3,"explanation":"Phương thức khởi tạo trong Python phải tên là __init__ và tham số đầu tiên phải là self để gán giá trị cho thực thể hiện tại.","hint":"Tên phương thức khởi tạo chuẩn trong Python là gì?","errorCategory":"syntax","tags":["class-init"],"source":"textbook","reserve":true,"expect":"Toyota"},{"id":"T7-Q46","topic":"T7","difficulty":2,"type":"replace","question":"Chọn đoạn code điền vào ___ để danh sách sinh viên được sắp xếp giảm dần theo GPA.","code":"class Student:\n    def __init__(self, name, gpa): \n        self.name = name; self.gpa = gpa\nss = [Student(\"A\", 3.2), Student(\"B\", 3.8)]\nss.sort(key=___, reverse=True)\nprint(ss[0].name)","options":["gpa","lambda s: s[1]","lambda s: gpa","lambda s: s.gpa"],"answer":3,"explanation":"Hàm sort yêu cầu một khóa (key) để so sánh. Vì ss chứa các đối tượng Student, ta dùng lambda để lấy thuộc tính gpa của từng đối tượng s.","hint":"Truy cập thuộc tính gpa của tham số s trong hàm lambda.","errorCategory":"method","tags":["sort-filter-objects"],"source":"exam","reserve":false,"expect":"B"},{"id":"T7-Q47","topic":"T7","difficulty":3,"type":"replace","question":"Chọn đoạn code điền vào ___ để in ra tổng giá trị của các món hàng có giá (price) lớn hơn 50.","code":"class Item:\n    def __init__(self, p): self.price = p\ncart = [Item(40), Item(60), Item(70)]\ntotal = ___\nprint(total)","options":["sum(cart.price if price > 50)","sum(price for price in cart if price > 50)","sum(i.price for i in cart if i.price > 50)","sum(i for i in cart if i.price > 50)"],"answer":2,"explanation":"Ta cần duyệt qua từng đối tượng 'i' trong 'cart', kiểm tra 'i.price > 50', và lấy ra giá trị 'i.price' để đưa vào hàm sum.","hint":"Sử dụng generator expression để lọc và trích xuất thuộc tính giá từ các đối tượng.","errorCategory":"logic","tags":["list-of-objects"],"source":"exam","reserve":false,"expect":130},{"id":"T7-Q48","topic":"T7","difficulty":2,"type":"replace","question":"Dòng ___ ban đầu là `super().__init__(name)`. Đoạn nào sau đây thay thế được dòng đó mà kết quả không đổi?","code":"class Animal:\n    def __init__(self, name): self.name = name\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        ___\n        self.breed = breed\nd = Dog(\"Lu\", \"Kobe\")\nprint(d.name)","options":["super(name)","Animal.__init__(self, name)","Animal(self, name)","self.name = Animal(name)"],"answer":1,"explanation":"Cách gọi trực tiếp Animal.__init__(self, name) là cách viết tường minh tương đương với super().__init__(name), thường dùng khi xử lý đa kế thừa phức tạp hoặc trong các phiên bản Python cũ.","hint":"Có thể gọi trực tiếp phương thức của lớp cha thông qua tên lớp, nhưng cần truyền tham số self.","errorCategory":"method","tags":["inheritance-super"],"source":"supplement","reserve":false,"expect":"Lu"},{"id":"T8-Q01","topic":"T8","difficulty":1,"type":"output","question":"Đoạn code sau sử dụng thư viện math để tìm ước chung lớn nhất (GCD). Kết quả in ra là gì?","code":"import math\na = 24\nb = 36\nprint(math.gcd(a, b))","options":["6","1","24","12"],"answer":3,"explanation":"Hàm math.gcd(a, b) trả về ước chung lớn nhất của hai số nguyên. Ước chung lớn nhất của 24 và 36 là 12.","hint":"Tìm số lớn nhất mà cả 24 và 36 đều chia hết.","errorCategory":"execution","tags":["math-module"],"source":"textbook","reserve":false},{"id":"T8-Q02","topic":"T8","difficulty":1,"type":"output","question":"Trong Python 3.11, đoạn code sau in ra giá trị nào?","code":"import random\nrandom.seed(42)\nprint(random.randint(1, 3))","options":["1","3","2","None"],"answer":1,"explanation":"Hàm random.randint(a, b) bao gồm cả hai đầu mút a và b. Với seed(42), giá trị ngẫu nhiên đầu tiên của randint(1, 3) trong Python 3.11 luôn là 3.","hint":"Lưu ý randint bao gồm cả giá trị dừng (stop value).","errorCategory":"execution","tags":["random-module"],"source":"textbook","reserve":false},{"id":"T8-Q03","topic":"T8","difficulty":1,"type":"theory","question":"Khi sử dụng từ khóa 'as' trong câu lệnh import (ví dụ: import math as m), mục đích chính là gì?","code":"","options":["Để tăng tốc độ thực thi của module đó.","Để tạo một bí danh (alias) giúp viết code ngắn gọn hơn hoặc tránh trùng tên.","Để giới hạn các hàm được phép sử dụng trong module.","Để yêu cầu Python tải module vào bộ nhớ cache."],"answer":1,"explanation":"Từ khóa 'as' tạo ra một bí danh (alias) cho module hoặc đối tượng được import, giúp lập trình viên viết code nhanh hơn hoặc xử lý xung đột tên gọi.","hint":"Hãy nhớ cách chúng ta dùng 'import pandas as pd'.","errorCategory":"theory","tags":["alias","import-styles"],"source":"textbook","reserve":false},{"id":"T8-Q04","topic":"T8","difficulty":2,"type":"output","question":"Kết quả của đoạn code sử dụng thư viện statistics sau là gì?","code":"import statistics\ndata = [10, 2, 8, 4, 6]\nprint(statistics.median(data))","options":["6","6.0","8","5.0"],"answer":0,"explanation":"Hàm statistics.median sẽ sắp xếp danh sách: [2, 4, 6, 8, 10]. Vì số phần tử lẻ (5), giá trị ở giữa là 6. Lưu ý median trả về số nguyên nếu phần tử ở giữa là số nguyên (không ép kiểu float trừ khi trung bình cộng 2 số giữa).","hint":"Sắp xếp dãy số trước khi tìm số ở vị trí chính giữa.","errorCategory":"execution","tags":["statistics-module"],"source":"textbook","reserve":false},{"id":"T8-Q05","topic":"T8","difficulty":2,"type":"error","question":"Đoạn code sau sẽ gây ra lỗi gì?","code":"import math\nfrom math import sqrt\nmath = \"Python\"\nprint(math.sqrt(16))","options":["AttributeError","TypeError","ValueError","NameError"],"answer":0,"explanation":"Biến 'math' ban đầu là một module, nhưng sau đó bị gán lại thành một chuỗi (string). Chuỗi không có thuộc tính 'sqrt', nên khi gọi math.sqrt(16) sẽ gây ra AttributeError.","hint":"Biến math hiện tại đang chứa kiểu dữ liệu gì?","errorCategory":"concept","tags":["import-styles"],"source":"supplement","reserve":false},{"id":"T8-Q06","topic":"T8","difficulty":2,"type":"output","question":"Đoạn code sau tính tuổi dựa trên thư viện datetime. Kết quả in ra là gì?","code":"from datetime import date\nbirthday = date(2000, 5, 20)\ntoday = date(2024, 5, 20)\nage = today.year - birthday.year\nprint(age)","options":["24","23","24.5","25"],"answer":0,"explanation":"Phép trừ birthday.year từ today.year lấy 2024 - 2000 = 24. Kết quả là số nguyên.","hint":"Chỉ tính toán dựa trên thuộc tính .year của đối tượng date.","errorCategory":"execution","tags":["datetime"],"source":"exam","reserve":false},{"id":"T8-Q07","topic":"T8","difficulty":2,"type":"compare","question":"Sự khác biệt chính giữa random.randint(1, 10) và random.randrange(1, 10) là gì?","code":"","options":["randint không bao gồm 10, randrange bao gồm cả 10.","randint bao gồm cả 10, randrange không bao gồm 10.","randint chỉ trả về số nguyên, randrange có thể trả về số thực.","Không có sự khác biệt, cả hai đều trả về số từ 1 đến 10."],"answer":1,"explanation":"random.randint(a, b) lấy giá trị trong đoạn [a, b] (bao gồm cả b). random.randrange(a, b) lấy giá trị trong khoảng [a, b) (không bao gồm b).","hint":"Hãy nhớ quy tắc của hàm range() truyền thống.","errorCategory":"concept","tags":["random-module"],"source":"textbook","reserve":false},{"id":"T8-Q08","topic":"T8","difficulty":2,"type":"output","question":"Kết quả của đoạn code sau là gì?","code":"import math\nx = -3.4\nprint(math.floor(x), math.ceil(x))","options":["-4 -3","-3 -4","-3 -3","-4 -4"],"answer":0,"explanation":"math.floor() làm tròn xuống số nguyên nhỏ hơn hoặc bằng nó (-4 <= -3.4). math.ceil() làm tròn lên số nguyên lớn hơn hoặc bằng nó (-3 >= -3.4).","hint":"Trên trục số, 'xuống' là về bên trái, 'lên' là về bên phải.","errorCategory":"execution","tags":["math-module"],"source":"textbook","reserve":false},{"id":"T8-Q09","topic":"T8","difficulty":3,"type":"output","question":"Giả sử đoạn code sau nằm trong file 'script.py' và được chạy trực tiếp bằng lệnh 'python script.py'. Kết quả in ra là gì?","code":"def check():\n    if __name__ == '__main__':\n        return 'A'\n    return 'B'\n\nprint(check())","options":["B","A","__main__","script"],"answer":1,"explanation":"Khi một file Python được chạy trực tiếp, biến đặc biệt __name__ sẽ được gán giá trị chuỗi '__main__'. Do đó điều kiện if là đúng và trả về 'A'.","hint":"Biến __name__ thay đổi tùy theo cách file được thực thi (chạy trực tiếp hay import).","errorCategory":"logic","tags":["name-main"],"source":"supplement","reserve":false},{"id":"T8-Q10","topic":"T8","difficulty":2,"type":"output","question":"Kết quả của đoạn code sau là gì?","code":"import random\nnums = [1, 2, 3]\nres = random.shuffle(nums)\nprint(res)","options":["None","[3, 2, 1]","[1, 2, 3]","TypeError"],"answer":0,"explanation":"Hàm random.shuffle() thay đổi danh sách truyền vào ngay tại chỗ (in-place) và trả về giá trị None.","hint":"Nhiều phương thức làm việc 'in-place' trong Python trả về gì?","errorCategory":"execution","tags":["random-module"],"source":"textbook","reserve":false},{"id":"T8-Q11","topic":"T8","difficulty":2,"type":"error","question":"Đoạn code sau đây phát sinh lỗi gì?","code":"from math import pi as p\nprint(pi)","options":["ImportError","SyntaxError","NameError","AttributeError"],"answer":2,"explanation":"Khi dùng 'as p', tên 'pi' không được định nghĩa trong không gian tên hiện tại, chỉ có bí danh 'p' mới tồn tại. Do đó gọi 'pi' dẫn đến NameError.","hint":"Bạn đã đổi tên pi thành p thì phải dùng p.","errorCategory":"syntax","tags":["alias","import-styles"],"source":"textbook","reserve":false},{"id":"T8-Q12","topic":"T8","difficulty":3,"type":"output","question":"Trong Python 3.11, thư viện statistics xử lý tập dữ liệu có nhiều yếu vị (multimodal) như thế nào qua hàm mode()? Kết quả sau là gì?","code":"import statistics\ndata = [1, 2, 2, 3, 3, 4]\nprint(statistics.mode(data))","options":["StatisticsError","3","[2, 3]","2"],"answer":3,"explanation":"Kể từ Python 3.8, hàm statistics.mode() trả về yếu vị đầu tiên tìm thấy trong dữ liệu nếu có nhiều giá trị có cùng tần suất xuất hiện cao nhất. Ở đây số 2 xuất hiện trước số 3.","hint":"Python 3.11 không còn báo lỗi khi có nhiều mode, nó chọn mode xuất hiện sớm nhất.","errorCategory":"execution","tags":["statistics-module"],"source":"supplement","reserve":false},{"id":"T8-Q13","topic":"T8","difficulty":1,"type":"theory","question":"Lệnh 'from math import *' có đặc điểm gì?","code":"","options":["Chỉ nhập vào các hằng số của module math.","Là cách tốt nhất và được khuyến khích nhất để import module.","Nhập tất cả các tên không bắt đầu bằng dấu gạch dưới từ math vào không gian tên hiện tại.","Sẽ tự động tạo một bí danh cho mọi hàm trong math."],"answer":2,"explanation":"Cú pháp 'import *' nhập mọi thực thể công khai (không có dấu gạch dưới phía trước) vào không gian tên hiện tại, dễ gây xung đột tên gọi.","hint":"Dùng '*' nghĩa là lấy tất cả nhưng có giới hạn về quy ước đặt tên.","errorCategory":"theory","tags":["import-styles"],"source":"textbook","reserve":false},{"id":"T8-Q14","topic":"T8","difficulty":3,"type":"output","question":"Sử dụng random.seed giúp tái lập kết quả. Với Python 3.11, kết quả in ra là gì?","code":"import random\nrandom.seed(10)\na = random.random()\nrandom.seed(10)\nb = random.random()\nprint(a == b)","options":["False","True","None","Error"],"answer":1,"explanation":"Khi thiết lập cùng một giá trị seed, bộ sinh số ngẫu nhiên sẽ tạo ra cùng một dãy số. Do đó a và b sẽ có giá trị bằng nhau.","hint":"Seed xác định trạng thái bắt đầu của bộ tạo số ngẫu nhiên.","errorCategory":"logic","tags":["random-module"],"source":"supplement","reserve":false},{"id":"T8-Q15","topic":"T8","difficulty":3,"type":"compare","question":"Để so sánh hai số thực xem chúng có xấp xỉ bằng nhau hay không (tránh lỗi sai số dấu phẩy động), hàm nào của module math thường được sử dụng?","code":"import math\nprint(math.isclose(0.1 + 0.2, 0.3))","options":["math.approx()","math.isclose()","math.equal()","math.fsum()"],"answer":1,"explanation":"math.isclose(a, b) kiểm tra xem hai giá trị có gần nhau không dựa trên một ngưỡng sai số cho phép. Điều này hữu ích vì 0.1 + 0.2 trong máy tính không bằng chính xác 0.3.","hint":"Tìm hàm kiểm tra sự 'gần nhau' (close).","errorCategory":"method","tags":["math-module","alias"],"source":"supplement","reserve":false},{"id":"T8-Q16","topic":"T8","difficulty":1,"type":"output","question":"Đoạn code sau sử dụng thư viện math. Kết quả in ra là gì?","code":"import math\nprint(int(math.sqrt(100) + math.pow(2, 3)))","options":["13","108","18","21"],"answer":2,"explanation":"math.sqrt(100) = 10.0; math.pow(2, 3) = 8.0. Tổng là 18.0. Ép kiểu int(18.0) cho kết quả 18.","hint":"Căn bậc hai của 100 và 2 mũ 3 là bao nhiêu?","errorCategory":"execution","tags":["math-module"],"source":"textbook","reserve":true},{"id":"T8-Q17","topic":"T8","difficulty":2,"type":"theory","question":"Trong thư viện datetime, đối tượng nào chỉ lưu trữ ngày, tháng, năm mà không có thông tin về giờ, phút, giây?","code":"","options":["datetime.datetime","datetime.time","datetime.timedelta","datetime.date"],"answer":3,"explanation":"datetime.date chỉ chứa year, month, day. datetime.time chứa hour, minute, second. datetime.datetime chứa cả hai.","hint":"Đối tượng nào có tên trùng với nghĩa 'ngày' trong tiếng Anh?","errorCategory":"theory","tags":["datetime"],"source":"textbook","reserve":true},{"id":"T8-Q18","topic":"T8","difficulty":3,"type":"error","question":"Đoạn code sau gây lỗi gì?","code":"import math as m\nprint(m.SQRT(16))","options":["AttributeError","NameError","TypeError","SyntaxError"],"answer":0,"explanation":"Python phân biệt chữ hoa chữ thường. Module math có hàm 'sqrt' viết thường, không có 'SQRT' viết hoa, nên gây ra AttributeError.","hint":"Kiểm tra cách viết hoa/thường của tên hàm.","errorCategory":"implementation","tags":["import-styles"],"source":"supplement","reserve":true},{"id":"T8-Q19","topic":"T8","difficulty":2,"type":"output","question":"Hàm mean trong thư viện statistics trả về giá trị gì cho dãy số sau?","code":"import statistics\nprint(statistics.mean([1, 2, 3, 4]))","options":["2","2.5","3","3.0"],"answer":1,"explanation":"Trung bình cộng là (1+2+3+4)/4 = 10/4 = 2.5.","hint":"Tính tổng rồi chia cho số lượng phần tử.","errorCategory":"execution","tags":["statistics-module"],"source":"textbook","reserve":true},{"id":"T8-Q20","topic":"T8","difficulty":1,"type":"output","question":"Đoạn code sau in ra gì?","code":"import random\nrandom.seed(5)\nprint(random.choice(['A', 'A', 'A']))","options":["None","['A']","A","Lỗi vì các phần tử trùng nhau"],"answer":2,"explanation":"random.choice() chọn ngẫu nhiên một phần tử từ sequence. Vì mọi phần tử đều là 'A', kết quả chắc chắn là 'A'.","hint":"Hàm choice chọn 1 phần tử duy nhất từ danh sách.","errorCategory":"execution","tags":["random-module"],"source":"textbook","reserve":true},{"id":"T8-Q21","topic":"T8","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import math as m\nprint(m.gcd(48, 18))","options":["12","4","6","2"],"answer":2,"explanation":"Hàm math.gcd(a, b) trả về ước chung lớn nhất (Greatest Common Divisor) của a và b. Ước chung lớn nhất của 48 và 18 là 6.","hint":"Tìm số lớn nhất mà cả 48 và 18 đều chia hết.","errorCategory":"concept","tags":["math-module","alias"],"source":"textbook","reserve":false},{"id":"T8-Q22","topic":"T8","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import math\nx = -4.7\nprint(math.ceil(x), math.floor(x))","options":["-5 -4","-4.0 -5.0","-5 -5","-4 -5"],"answer":3,"explanation":"math.ceil() làm tròn lên số nguyên gần nhất (lớn hơn hoặc bằng x), với -4.7 thì số nguyên lớn hơn gần nhất là -4. math.floor() làm tròn xuống số nguyên gần nhất (nhỏ hơn hoặc bằng x), với -4.7 là -5.","hint":"Trên trục số, ceil() đi về phía bên phải, floor() đi về phía bên trái.","errorCategory":"logic","tags":["math-module"],"source":"textbook","reserve":false},{"id":"T8-Q23","topic":"T8","difficulty":1,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import math as m\nresult = math.sqrt(16)\nprint(result)","options":["NameError","4.0","AttributeError","4"],"answer":0,"explanation":"Khi sử dụng 'import math as m', module math đã được gán định danh (alias) là 'm'. Do đó, bạn phải gọi 'm.sqrt()'. Gọi 'math.sqrt()' sẽ gây ra lỗi NameError vì tên 'math' không còn tồn tại trong phạm vi hiện tại.","hint":"Khi dùng 'as', tên cũ của module có còn truy cập được không?","errorCategory":"execution","tags":["alias","import-styles"],"source":"textbook","reserve":false},{"id":"T8-Q24","topic":"T8","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import statistics\ndata = [1, 5, 5, 2, 100]\nprint(statistics.median(data))","options":["5.0","22.6","5","2"],"answer":2,"explanation":"statistics.median() tính số trung vị. Đầu tiên dãy được sắp xếp: [1, 2, 5, 5, 100]. Vì dãy có 5 phần tử (lẻ), trung vị là phần tử ở giữa, tức là 5.","hint":"Trung vị là giá trị nằm chính giữa tập dữ liệu đã sắp xếp.","errorCategory":"theory","tags":["statistics-module"],"source":"textbook","reserve":false},{"id":"T8-Q25","topic":"T8","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import random\nnums = [10, 20, 30]\nres = random.shuffle(nums)\nprint(res)","options":["None","[30, 20, 10]","[10, 20, 30]","Một danh sách ngẫu nhiên"],"answer":0,"explanation":"Hàm random.shuffle() thực hiện xáo trộn danh sách tại chỗ (in-place) và trả về giá trị None. Đây là bẫy phổ biến khi sinh viên nghĩ nó trả về danh sách mới.","hint":"Nhiều phương thức làm thay đổi đối tượng gốc trong Python thường trả về gì?","errorCategory":"method","tags":["random-module"],"source":"textbook","reserve":true},{"id":"T8-Q26","topic":"T8","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"import statistics\ntry:\n    val = statistics.mode([1, 2, 2, 3, 3])\n    print(val)\nexcept:\n    print(\"Error\")","options":["2","1","3","Error"],"answer":0,"explanation":"Trong Python 3.11, statistics.mode() trả về giá trị xuất hiện nhiều nhất đầu tiên tìm thấy nếu có nhiều giá trị cùng tần suất cao nhất. Trong list [1, 2, 2, 3, 3], cả 2 và 3 đều xuất hiện 2 lần, nhưng 2 xuất hiện trước.","hint":"Nếu có nhiều Mode, Python 3.x sẽ chọn giá trị nào xuất hiện trước trong dữ liệu?","errorCategory":"execution","tags":["statistics-module"],"source":"supplement","reserve":false},{"id":"T8-Q27","topic":"T8","difficulty":3,"type":"output","question":"Đoạn code sau in ra kết quả gì?","code":"from datetime import date\nd1 = date(2024, 5, 20)\nd2 = date(2023, 5, 20)\ndiff = d1 - d2\nprint(diff.days)","options":["1","365","366","TypeError"],"answer":2,"explanation":"Phép trừ hai đối tượng date trả về một đối tượng timedelta. Từ 20/05/2023 đến 20/05/2024 là một năm. Vì năm 2024 là năm nhuận (tháng 2 có 29 ngày), khoảng cách là 366 ngày.","hint":"Hãy chú ý xem năm 2024 có gì đặc biệt so với năm 2023.","errorCategory":"edge","tags":["datetime"],"source":"exam","reserve":false},{"id":"T8-Q28","topic":"T8","difficulty":2,"type":"output","question":"Đoạn code sau in ra kết quả gì?","cod
