sử: 0-4m3: 10đ, >4m3: 20đ\n    tien = 0\n    if m3 <= 4:\n        tien = m3 * 10\n    else:\n        tien = 4 * 10 + (m3 - 4) * 20\n    return tien\n\nprint(tinh_nuoc(6))\n# Output: 80\n```\n\n**Lưu ý**: Đề thi thường yêu cầu làm tròn kết quả (dùng `round()`) hoặc ép kiểu `int()` tùy yêu cầu."},{"title":"Bẫy thường gặp khi thi","source":"exam","body":"- **Vòng lặp vô tận**: Quên cập nhật biến điều kiện trong `while` (ví dụ quên `i += 1`).\n- **Sai lệch vị trí (Off-by-one)**: Dùng `range(n)` khi đề yêu cầu chạy đến `n` (phải dùng `range(n + 1)`).\n- **Nhầm lẫn giữa `break` và `return`**: `break` thoát vòng lặp, `return` thoát toàn bộ hàm.\n- **Sửa danh sách khi đang lặp**: Tránh dùng `for x in list_a` rồi `list_a.remove(x)`, sẽ gây bỏ sót phần tử. Nên tạo bản sao `for x in list_a[:]`."},{"title":"Checklist trước khi nộp bài","source":"exam","body":"- [ ] Hàm đã `return` kết quả hay chỉ `print`? (Đề yêu cầu viết hàm thường phải `return`).\n- [ ] Đã xử lý các trường hợp biên (số âm, số 0, danh sách rỗng) chưa?\n- [ ] Tên hàm và tham số có khớp chính xác với yêu cầu của đề không?\n- [ ] Với bài toán ma trận, chỉ số dòng/cột bắt đầu từ 0 hay 1? (Python mặc định từ 0).\n- [ ] Các biến tích lũy (tổng, đếm) đã được khởi tạo đúng vị trí chưa (trong hay ngoài vòng lặp lồng)?"}]},"T3":{"sections":[{"title":"Các phương thức List cơ bản","source":"textbook","body":"List là danh sách có thứ tự và có thể thay đổi. Cần phân biệt rõ cách thêm và xóa phần tử.\n- `append(x)`: Thêm `x` vào cuối list.\n- `extend(iterable)`: Mở rộng list bằng cách thêm tất cả phần tử từ một iterable khác.\n- `insert(i, x)`: Chèn `x` vào vị trí chỉ số `i`.\n- `pop(i)`: Lấy ra và xóa phần tử tại chỉ số `i` (mặc định là cuối cùng).\n- `remove(x)`: Xóa phần tử đầu tiên có giá trị là `x` (gây lỗi `ValueError` nếu không thấy).\n- `del a[i]`: Câu lệnh xóa phần tử tại vị trí `i` hoặc xóa lát cắt (slice).\n\n```python\na = [1, 2]\na.append([3, 4]) # [1, 2, [3, 4]]\na.extend([5, 6]) # [1, 2, [3, 4], 5, 6]\na.pop(0) # Trả về 1, list còn [[3, 4], 5, 6]\n```"},{"title":"Sắp xếp và Đảo ngược","source":"textbook","body":"Trong kỳ thi, việc nhầm lẫn giữa phương thức tại chỗ (in-place) và hàm trả về bản sao là lỗi phổ biến nhất.\n- `a.sort()`: Sắp xếp lại chính danh sách `a`, trả về **None**.\n- `sorted(a)`: Trả về một **danh sách mới** đã sắp xếp, `a` không đổi.\n- `a.reverse()`: Đảo ngược chính `a` tại chỗ.\n- `reversed(a)`: Trả về một iterator đảo ngược, không phải list.\n\n```python\nnums = [3, 1, 2]\nres = nums.sort()\nprint(res) # Output: None\nprint(nums) # Output: [1, 2, 3]\n\nnew_nums = sorted([5, 4, 6], reverse=True)\nprint(new_nums) # Output: [6, 5, 4]\n```"},{"title":"Copy và Bẫy tham chiếu Ma trận","source":"supplement","body":"Khi gán `b = a`, cả hai biến cùng trỏ vào một vùng nhớ. Thay đổi `b` sẽ làm `a` thay đổi. Để sao chép thực sự, dùng `b = a[:]` hoặc `b = a.copy()`.\n**Bẫy nhân danh sách:** `[[0]*3]*2` tạo ra 2 dòng nhưng cả 2 dòng thực chất là **cùng một đối tượng**.\n\n```python\n# Bẫy tham chiếu\nm = [[0]*2]*2\nm[0][0] = 9\nprint(m) # Output: [[9, 0], [9, 0]]\n\n# Cách đúng để tạo ma trận\nm_right = [[0 for _ in range(2)] for _ in range(2)]\nm_right[0][0] = 9\nprint(m_right) # Output: [[9, 0], [0, 0]]\n```"},{"title":"List Comprehension có điều kiện","source":"textbook","body":"Cú pháp rút gọn giúp tạo list mới từ list cũ một cách nhanh chóng.\n- Cú pháp: `[expression for item in iterable if condition]`\n\n```python\n# Lấy bình phương các số chẵn\nnums = [1, 2, 3, 4, 5, 6]\neven_sq = [x**2 for x in nums if x % 2 == 0]\nprint(even_sq) # Output: [4, 16, 36]\n\n# Kết hợp if-else (phải đặt trước for)\n# format: [val_if if cond else val_else for item in list]\nstatus = [\"Chẵn\" if x % 2 == 0 else \"Lẻ\" for x in range(3)]\nprint(status) # Output: ['Chẵn', 'Lẻ', 'Chẵn']\n```"},{"title":"Tuple: Tính bất biến và Unpacking","source":"textbook","body":"Tuple tương tự list nhưng không thể sửa đổi sau khi tạo (immutable). Thường dùng để bảo vệ dữ liệu.\n- Tuple 1 phần tử: Phải có dấu phẩy `(1,)`, nếu viết `(1)` Python hiểu là số nguyên trong ngoặc đơn.\n- **Unpacking**: Gán các phần tử của tuple/list cho các biến đơn lẻ.\n\n```python\nt = (1, 2, 3)\n# t[0] = 10 # Lỗi TypeError\n\na, b = 10, 20\na, b = b, a # Hoán đổi giá trị dùng tuple unpacking\nprint(a, b) # Output: 20 10\n\nsingle = (5,) \nprint(type(single)) # Output: <class 'tuple'>\n```"},{"title":"Xử lý Ma trận (List lồng nhau)","source":"exam","body":"Trong đề thi, ma trận thường được biểu diễn là list của các list (dòng).\n- Truy cập: `matrix[row_index][col_index]`.\n- Duyệt cột: Dùng vòng lặp theo chỉ số dòng hoặc `zip(*matrix)`.\n\n```python\nmatrix = [[1, 2, 3], [4, 5, 6]]\n# Tính tổng từng dòng\nrow_sums = [sum(row) for row in matrix]\n\n# Chuyển vị ma trận (Transpose)\ntransposed = [list(it) for it in zip(*matrix)]\nprint(transposed) # Output: [[1, 4], [2, 5], [3, 6]]\n```"},{"title":"Hàm Enumerate và Zip","source":"supplement","body":"- `enumerate(iterable)`: Trả về cặp `(chỉ_số, giá_trị)`. Rất hữu ích khi cần vị trí phần tử.\n- `zip(*iterables)`: Ghép các iterable lại với nhau theo từng cặp phần tử tương ứng.\n\n```python\nnames = [\"An\", \"Bình\"]\nmarks = [8, 9]\n\nfor i, name in enumerate(names):\n    print(f\"{i}: {name}\") # Output: 0: An, 1: Bình\n\nfor name, mark in zip(names, marks):\n    print(f\"{name} được {mark}\") # Output: An được 8, Bình được 9\n```"},{"title":"Bẫy thường gặp và Checklist","source":"exam","body":"### Bẫy cần tránh:\n- **Sửa list khi đang lặp**: Nếu dùng `for x in a:` rồi `a.remove(x)`, các phần tử sẽ bị nhảy cóc do chỉ số thay đổi. Giải pháp: Duyệt qua bản sao `for x in a[:]`.\n- **IndexError**: Truy cập `a[len(a)]` (chỉ số cao nhất luôn là `len-1`).\n- **In/Not in**: `x in a` có độ phức tạp O(n), với ma trận cần kiểm tra từng dòng.\n\n### Checklist trước khi nộp:\n- Đã xử lý trường hợp danh sách rỗng chưa?\n- Hàm có vô tình trả về `None` do dùng `list.sort()` không?\n- Đã sử dụng đúng yêu cầu về dòng/cột (bắt đầu từ 0 hay 1)?\n- Kiểm tra `pop()` trên list rỗng sẽ gây lỗi."}]},"T4":{"sections":[{"title":"Truy cập và xử lý KeyError","source":"textbook","body":"Trong Dictionary, việc truy cập khóa không tồn tại bằng `d[key]` sẽ gây lỗi **KeyError**. Để an toàn, ta dùng phương thức `.get(key, default)`.\n\n- `d[key]`: Trả về giá trị nếu có, nếu không có sẽ văng lỗi.\n- `d.get(key, default)`: Trả về `default` (mặc định là `None`) nếu không tìm thấy khóa.\n\n```python\nd = {\"name\": \"PTIT\", \"year\": 1953}\n# print(d[\"code\"]) # Lỗi KeyError\nprint(d.get(\"code\", \"N/A\")) # Output: N/A\n```"},{"title":"Duyệt Dictionary và các View Objects","source":"textbook","body":"Python cung cấp 3 phương thức quan trọng để lấy dữ liệu từ dict:\n\n- `.keys()`: Danh sách các khóa.\n- `.values()`: Danh sách các giá trị.\n- `.items()`: Danh sách các cặp tuple `(key, value)`. Thường dùng trong vòng lặp `for`.\n\n```python\nscores = {\"Alice\": 8.5, \"Bob\": 9.0}\nfor name, score in scores.items():\n    print(f\"{name}: {score}\")\n# Output:\n# Alice: 8.5\n# Bob: 9.0\n```"},{"title":"Dictionary lồng nhau (Nested Dictionary)","source":"exam","body":"Dạng bài thi thường dùng dict lồng nhau để quản lý dữ liệu phức tạp (như tỷ giá ngoại tệ). Truy cập bằng cách viết nhiều cặp ngoặc vuông liên tiếp.\n\n```python\nrates = {\n    \"USD\": {\"buy\": 25100, \"sell\": 25450},\n    \"EUR\": {\"buy\": 27200, \"sell\": 27800}\n}\n# Lấy giá bán của USD\nprint(rates[\"USD\"][\"sell\"]) # Output: 25450\n```"},{"title":"Đếm tần suất xuất hiện","source":"exam","body":"Kỹ thuật dùng `.get(key, 0) + 1` rất phổ biến trong đề thi (ví dụ: đếm số Harshad, đếm từ trong file).\n\n```python\ndata = [1, 2, 2, 3, 1, 1]\ncounts = {}\nfor x in data:\n    counts[x] = counts.get(x, 0) + 1\nprint(counts) # Output: {1: 3, 2: 2, 3: 1}\n```"},{"title":"Khóa (Key) và tính Hashable","source":"supplement","body":"Khóa của dict phải là kiểu dữ liệu **immutable** (bất biến) và **hashable**. \n- **Hợp lệ**: `int`, `float`, `str`, `tuple` (nếu tuple chỉ chứa các phần tử bất biến).\n- **Không hợp lệ**: `list`, `dict`, `set` (gây `TypeError: unhashable type`).\n- **Đặc biệt**: `1`, `1.0`, và `True` được coi là cùng một khóa vì chúng có giá trị bằng nhau.\n\n```python\nd = {1: \"int\", 1.0: \"float\", True: \"bool\"}\nprint(d) # Output: {1: 'bool'}\nprint(len(d)) # Output: 1\n```"},{"title":"Sắp xếp Dictionary","source":"supplement","body":"Mặc định từ Python 3.7+, dict giữ thứ tự chèn. Để sắp xếp theo khóa hoặc giá trị, ta dùng hàm `sorted()` kết hợp `lambda`.\n\n```python\nprices = {\"Apple\": 50, \"Orange\": 20, \"Banana\": 30}\n# Sắp xếp theo giá trị tăng dần\nsorted_p = dict(sorted(prices.items(), key=lambda item: item[1]))\nprint(sorted_p) # Output: {'Orange': 20, 'Banana': 30, 'Apple': 50}\n```"},{"title":"Set (Tập hợp) và các phép toán","source":"textbook","body":"Set chứa các phần tử duy nhất, không thứ tự. \n- Khởi tạo set rỗng phải dùng `set()`, dùng `{}` sẽ tạo ra dict rỗng.\n- Loại bỏ trùng lặp: `list(set(my_list))`.\n\nCác phép toán:\n- `&` (intersection): Giao.\n- `|` (union): Hợp.\n- `-` (difference): Hiệu.\n\n```python\na = {1, 2, 3}\nb = {3, 4, 5}\nprint(a & b) # Output: {3}\nprint(a | b) # Output: {1, 2, 3, 4, 5}\n```"},{"title":"Bẫy thường gặp khi thi","source":"exam","body":"- **Lỗi Logic**: Nhầm lẫn giữa `d[k]` (lấy giá trị) và `k` (lấy khóa) khi duyệt `for k in d`.\n- **Lỗi Cú pháp**: Khai báo set rỗng bằng `s = {}` (thực tế đây là dict).\n- **Lỗi Thực thi**: Cố gắng dùng `list` làm key trong dict hoặc phần tử trong set.\n- **Lỗi So sánh**: Khóa `'1'` (chuỗi) khác hoàn toàn với khóa `1` (số).\n- **Lỗi Xóa**: Thay đổi kích thước dict (thêm/xóa phần tử) ngay khi đang lặp qua nó sẽ gây lỗi `RuntimeError`."},{"title":"Checklist trước khi nộp bài","source":"exam","body":"- [ ] Đã dùng `.get()` để tránh crash khi khóa không tồn tại chưa?\n- [ ] Nếu đề yêu cầu sắp xếp kết quả, đã dùng `sorted()` chưa?\n- [ ] Các khóa của dict có phải là kiểu bất biến (string, int...) không?\n- [ ] Set đã dùng đúng cú pháp `set()` cho trường hợp rỗng chưa?\n- [ ] Khi tính toán tiền (như bài nước/ngoại tệ), đã chú ý ép kiểu số thực/số nguyên và làm tròn theo yêu cầu chưa?"}]},"T5":{"sections":[{"title":"Bản chất của return và print","source":"textbook","body":"Trong Python, `print()` chỉ hiển thị giá trị ra màn hình, còn **return** mới là lệnh kết thúc hàm và trả về giá trị để sử dụng tiếp. Nếu một hàm không có lệnh `return`, nó sẽ mặc định trả về `None`.\n\n- **Bản chất**: Lệnh `return` dừng thực thi hàm ngay lập tức.\n- **Ví dụ**:\n```python\ndef add(a, b):\n    print(a + b)\n\nresult = add(5, 3)\n# Output: 8\nprint(result)\n# Output: None\n```\n- **Bẫy**: Đề thi yêu cầu 'Viết hàm tính...' thường yêu cầu trả về giá trị (`return`), không phải in ra (`print`). Nếu dùng `print`, các hàm xử lý tiếp theo sẽ nhận giá trị `None` và gây lỗi `TypeError`."},{"title":"Tham số mặc định và Đối số từ khóa","source":"textbook","body":"Python cho phép đặt giá trị mặc định cho tham số. Khi gọi hàm, ta có thể truyền đối số theo vị trí (positional) hoặc theo tên (keyword).\n\n- **Quy tắc vàng**: Tham số mặc định phải luôn **đứng sau** các tham số không có giá trị mặc định.\n- **Cú pháp**:\n```python\ndef greet(name, msg=\"Chào\"): \n    return f\"{msg}, {name}!\"\n\nprint(greet(\"An\")) # Output: Chào, An!\nprint(greet(msg=\"Hi\", name=\"Bình\")) # Keyword args. Output: Hi, Bình!\n```\n- **Bẫy**: Định nghĩa `def func(a=1, b):` sẽ gây lỗi `SyntaxError: non-default argument follows default argument`."},{"title":"Bẫy tham số mặc định là Mutable (list, dict)","source":"supplement","body":"Giá trị mặc định chỉ được khởi tạo **một lần duy nhất** khi hàm được định nghĩa, không phải mỗi khi hàm được gọi. Nếu dùng một đối tượng thay đổi được (mutable) như `list` làm giá trị mặc định, nó sẽ 'nhớ' dữ liệu của các lần gọi trước.\n\n- **Ví dụ lỗi**:\n```python\ndef add_item(item, lst=[]):\n    lst.append(item)\n    return lst\n\nprint(add_item(1)) # [1]\nprint(add_item(2)) # Output: [1, 2] (Sai kỳ vọng là [2])\n```\n- **Cách sửa**: Dùng `lst=None` và kiểm tra `if lst is None: lst = []` bên trong hàm."},{"title":"Phạm vi biến và UnboundLocalError","source":"textbook","body":"Biến bên trong hàm là **cục bộ** (local). Biến bên ngoài là **toàn cục** (global). \n\n- **Quy tắc**: Hàm có thể đọc biến global nhưng không thể sửa đổi nó trực tiếp trừ khi dùng từ khóa `global`.\n- **Lỗi UnboundLocalError**: Xảy ra khi bạn cố gắng gán giá trị cho một biến trong hàm mà biến đó trùng tên với biến global nhưng chưa được khai báo `global` trong hàm.\n```python\nx = 10\ndef update():\n    # x = x + 1  # Lỗi UnboundLocalError\n    global x\n    x += 1\nupdate()\nprint(x) # Output: 11\n```"},{"title":"Biến tham số linh hoạt *args và **kwargs","source":"textbook","body":"- `*args`: Thu thập các đối số vị trí dư thừa vào một **tuple**.\n- `**kwargs`: Thu thập các đối số từ khóa dư thừa vào một **dictionary**.\n\n```python\ndef func(*args, **kwargs):\n    print(args) \n    print(kwargs)\n\nfunc(1, 2, a=3, b=4)\n# Output: (1, 2)\n# Output: {'a': 3, 'b': 4}\n```"},{"title":"Lambda và Hàm bậc cao (map, filter, sorted)","source":"textbook","body":"**Lambda** là hàm ẩn danh một dòng. Kết quả của biểu thức sau dấu `:` tự động được trả về.\n\n- **map(func, iterable)**: Áp dụng hàm lên từng phần tử.\n- **filter(func, iterable)**: Giữ lại phần tử nếu hàm trả về `True`.\n- **Lưu ý**: Cả hai trả về iterator, cần ép kiểu `list()` để xem kết quả.\n- **Ví dụ sorted với lambda** (Thường dùng trong đề thi để sắp xếp danh sách sinh viên):\n```python\nstudents = [(\"An\", 8.5), (\"Bình\", 9.0), (\"Cường\", 7.0)]\n# Sắp xếp theo điểm giảm dần\nsorted_st = sorted(students, key=lambda x: x[1], reverse=True)\n# Output: [('Bình', 9.0), ('An', 8.5), ('Cường', 7.0)]\n```"},{"title":"Truyền List vào hàm: Tham chiếu vs Gán lại","source":"textbook","body":"Khi truyền một `list` vào hàm:\n- Nếu dùng các phương thức làm thay đổi tại chỗ như `.append()`, `.sort()`, `.pop()`, danh sách gốc bên ngoài **sẽ bị thay đổi**.\n- Nếu gán tham số đó bằng một list mới (`lst = [1, 2]`), liên kết với danh sách gốc sẽ bị đứt, danh sách gốc **không đổi**.\n\n```python\ndef modify(my_list):\n    my_list.append(100) # Gốc thay đổi\n\ndef reassign(my_list):\n    my_list = [1, 2] # Gốc KHÔNG thay đổi\n```"},{"title":"Bẫy thường gặp khi thi","source":"exam","body":"1. **Lỗi logic làm tròn**: Đề bài yêu cầu làm tròn hàng đơn vị (`round(x)`), sinh viên hay quên hoặc làm tròn sai kiểu (ví dụ dùng `int()` sẽ bị mất phần thập phân thay vì làm tròn).\n2. **Sai kiểu dữ liệu trả về**: Đề yêu cầu trả về một `dict` nhưng sinh viên lại `print` các cặp key-value.\n3. **Sắp xếp đối tượng**: Trong bài tập về Class, khi dùng `sorted(list_obj, key=lambda x: x.get_gpa())`, nhớ rằng `key` nhận vào từng phần tử của danh sách.\n4. **Giá trị trả về mặc định**: Khi viết hàm kiểm tra (is_harshad, is_prime...), luôn đảm bảo mọi nhánh `if/else` đều có `return True` hoặc `return False`."},{"title":"Checklist trước khi nộp bài","source":"exam","body":"- [ ] Hàm đã có `return` chưa hay đang để `print`?\n- [ ] Các tham số mặc định đã đặt ở cuối danh sách tham số chưa?\n- [ ] Nếu dùng `map` hoặc `filter`, đã ép kiểu sang `list` chưa?\n- [ ] Tên hàm và số lượng tham số có đúng y hệt yêu cầu đề bài không?\n- [ ] Đã kiểm thử với các giá trị mẫu (test cases) đề bài cho chưa?"}]},"T6":{"sections":[{"title":"Mở và Đóng File với 'with'","source":"textbook","body":"Bản chất: Để làm việc với file, ta dùng hàm `open()`. Tuy nhiên, cách tốt nhất là dùng từ khóa **with**, giúp Python tự động đóng file sau khi kết thúc khối lệnh, tránh rò rỉ bộ nhớ.\n- **'r'**: Đọc file (mặc định). Lỗi `FileNotFoundError` nếu file không tồn tại.\n- **'w'**: Ghi file. **Lưu ý**: Sẽ xóa sạch nội dung cũ (ghi đè). Tạo file mới nếu chưa có.\n- **'a'**: Ghi thêm (append) vào cuối file, không xóa dữ liệu cũ.\n- **encoding='utf-8'**: Luôn nên dùng để tránh lỗi font tiếng Việt.\n\n```python\n# Ghi file\nwith open('test.txt', 'w', encoding='utf-8') as f:\n    f.write('Xin chào PTIT\\nLập trình Python')\n\n# Đọc file\nwith open('test.txt', 'r', encoding='utf-8') as f:\n    content = f.read()\n    print(content)\n# Output: \n# Xin chào PTIT\n# Lập trình Python\n```"},{"title":"Các Phương Thức Đọc File","source":"textbook","body":"Cơ chế: Tùy nhu cầu xử lý mà chọn phương thức phù hợp:\n- `read()`: Đọc toàn bộ file thành 1 chuỗi duy nhất.\n- `readline()`: Đọc từng dòng một (mỗi lần gọi đọc một dòng).\n- `readlines()`: Đọc toàn bộ file và trả về một **list** các chuỗi, mỗi chuỗi là một dòng.\n- **Lặp trực tiếp**: `for line in f:` là cách hiệu quả nhất về bộ nhớ để duyệt từng dòng.\n\n```python\nfake_file_content = \"Dòng 1\\nDòng 2\\nDòng 3\"\nlines = fake_file_content.splitlines()\n\nfor line in lines:\n    print(line.strip()) # strip() để loại bỏ dấu xuống dòng \\n dư thừa\n# Output:\n# Dòng 1\n# Dòng 2\n# Dòng 3\n```"},{"title":"Xử Lý Token và Lọc Dữ Liệu","source":"exam","body":"Bản chất: Đề thi thường yêu cầu đọc file chứa các giá trị cách nhau bởi khoảng trắng/xuống dòng (token), sau đó lọc ra các số để xử lý (ví dụ: đếm số Harshad).\n- Dùng `split()`: Tự động tách chuỗi theo khoảng trắng, tab, xuống dòng.\n- Dùng `isdigit()` hoặc `isnumeric()`: Kiểm tra chuỗi có phải là số nguyên dương không.\n\n```python\ndata = \"12  abc  24\\n  45  xyz\"\ntokens = data.split() # ['12', 'abc', '24', '45', 'xyz']\nnumbers = [int(t) for t in tokens if t.isdigit()]\nprint(numbers)\n# Output: [12, 24, 45]\n```"},{"title":"Cấu Trúc Try-Except-Else-Finally","source":"textbook","body":"Cơ chế: Dùng để xử lý các tình huống lỗi khiến chương trình bị dừng đột ngột (crash).\n- **try**: Chứa code có nguy cơ gây lỗi.\n- **except**: Chạy khi có lỗi xảy ra trong khối `try`.\n- **else**: Chạy nếu khối `try` **không** có lỗi.\n- **finally**: Luôn luôn chạy dù có lỗi hay không (thường dùng để dọn dẹp tài nguyên).\n\n```python\ndef divide(a, b):\n    try:\n        res = a / b\n    except ZeroDivisionError:\n        print(\"Lỗi chia cho 0\")\n    else:\n        print(f\"Kết quả: {res}\")\n    finally:\n        print(\"Hoàn thành phép tính\")\n\ndivide(10, 2)\n# Output:\n# Kết quả: 5.0\n# Hoàn thành phép tính\n```"},{"title":"Các Loại Exception Thường Gặp","source":"textbook","body":"Sinh viên cần phân biệt rõ các loại lỗi để bắt (catch) chính xác:\n- `FileNotFoundError`: Mở file không tồn tại (chế độ 'r').\n- `ValueError`: Ép kiểu sai (ví dụ `int('abc')`).\n- `ZeroDivisionError`: Chia cho số 0.\n- `KeyError`: Truy cập key không tồn tại trong dictionary.\n- `IndexError`: Truy cập chỉ số nằm ngoài phạm vi của list.\n- `TypeError`: Thực hiện toán tử trên các kiểu dữ liệu không phù hợp (ví dụ `'a' + 1`).\n- `NameError`: Sử dụng biến chưa được định nghĩa.\n\n```python\ntry:\n    with open('non_existent.txt', 'r') as f: pass\nexcept FileNotFoundError:\n    print(\"File không tìm thấy\")\n# Output: File không tìm thấy\n```"},{"title":"Làm Việc với JSON","source":"textbook","body":"Cơ chế: JSON là định dạng phổ biến để lưu trữ dữ liệu có cấu trúc (như list, dict). Python dùng module `json`.\n- **Ghi**: `json.dump(obj, f)` (ghi vào file), `json.dumps(obj)` (trả về chuỗi JSON).\n- **Đọc**: `json.load(f)` (đọc từ file), `json.loads(s)` (đọc từ chuỗi).\n\n```python\nimport json\nstudent = {\"id\": \"B21\", \"gpa\": 3.2}\njson_str = json.dumps(student)\nprint(json_str)\n# Output: {\"id\": \"B21\", \"gpa\": 3.2}\n\nback_to_dict = json.loads(json_str)\nprint(back_to_dict['gpa'])\n# Output: 3.2\n```"},{"title":"Bắt Nhiều Exception và Lệnh Raise","source":"supplement","body":"Cú pháp: Có thể bắt nhiều loại lỗi trên một dòng bằng `tuple` hoặc nhiều khối `except` kế tiếp nhau. Dùng `raise` để chủ động tạo ra lỗi.\n\n```python\ntry:\n    val = int(\"not_a_number\")\nexcept (ValueError, TypeError) as e:\n    print(f\"Có lỗi xảy ra: {e}\")\n\n# Chủ động báo lỗi\ndef check_age(age):\n    if age < 0:\n        raise ValueError(\"Tuổi không được âm\")\n```"},{"title":"Bẫy Thường Gặp Khi Thi","source":"exam","body":"- **Quên `strip()`**: Khi đọc file bằng `readlines()`, mỗi phần tử sẽ có dấu `\\n` ở cuối, dễ gây lỗi khi so sánh chuỗi hoặc ép kiểu số.\n- **Nhầm lẫn `w` và `a`**: Đề yêu cầu ghi thêm dữ liệu nhưng dùng `w` dẫn đến mất dữ liệu cũ.\n- **Lỗi ép kiểu**: Khi đọc file, mọi thứ đều là string. Phải dùng `int()` hoặc `float()` trước khi tính toán.\n- **Đường dẫn file**: Khi thi, thường chỉ cần dùng tên file (ví dụ 'data.txt'), không nên dùng đường dẫn tuyệt đối (ví dụ 'C:/Users/...') vì máy giám khảo sẽ khác.\n- **Quên import**: Sử dụng `json` mà không `import json` hoặc dùng `math` mà không `import math`."},{"title":"Checklist Trước Khi Nộp Bài","source":"exam","body":"- [ ] Đã dùng `with open(...)` để đảm bảo đóng file chưa?\n- [ ] Đã thêm `encoding='utf-8'` khi đọc/ghi file có tiếng Việt chưa?\n- [ ] Đã bắt lỗi `FileNotFoundError` khi đọc file để chương trình không bị crash chưa?\n- [ ] Đã dùng `split()` để tách token thay vì xử lý chuỗi thủ công chưa?\n- [ ] Các hàm xử lý file đã `return` đúng kiểu dữ liệu (dict, list) đề bài yêu cầu chưa?\n- [ ] Kiểm tra xem file kết quả có đúng định dạng JSON (nếu đề yêu cầu `json.dump`) chưa?"}]},"T7":{"sections":[{"title":"Khởi tạo Lớp và Đối tượng với __init__","source":"textbook","body":"Trong Python, **class** là một bản thiết kế (blueprint) để tạo ra các đối tượng. Phương thức `__init__` được gọi tự động khi một đối tượng mới được tạo ra để thiết lập các giá trị ban đầu cho thuộc tính.\n\nCú pháp:\n```python\nclass Student:\n    def __init__(self, name, gpa):\n        self.name = name  # Thuộc tính đối tượng\n        self.gpa = gpa\n\nsv1 = Student(\"An\", 3.5)\nprint(sv1.name)\n# Output: An\n```\n**Bẫy**: Nếu quên `self` làm tham số đầu tiên trong `__init__`, Python sẽ báo `TypeError` khi bạn khởi tạo đối tượng."},{"title":"Tham số self và lỗi AttributeError","source":"textbook","body":"**self** đại diện cho chính thực thể (instance) đang được thao tác. Mọi phương thức bên trong lớp đều phải có `self` là tham số đầu tiên. Để truy cập thuộc tính trong cùng một lớp, ta bắt buộc dùng `self.ten_thuoc_tinh`.\n\nVí dụ lỗi phổ biến:\n```python\nclass Car:\n    def __init__(self, brand):\n        self.brand = brand\n    def show(self):\n        print(brand) # Lỗi! Phải là self.brand\n\n# c = Car(\"Toyota\")\n# c.show() # NameError: name 'brand' is not defined\n```\n**AttributeError**: Xảy ra khi bạn cố gắng truy cập một thuộc tính hoặc phương thức không tồn tại trên đối tượng đó (ví dụ gõ sai tên thuộc tính `self.id` thành `self.ID`)."},{"title":"Thuộc tính Đối tượng vs Thuộc tính Lớp","source":"textbook","body":"- **Thuộc tính đối tượng (Instance attribute)**: Được định nghĩa bên trong `__init__`, mỗi đối tượng có một giá trị riêng.\n- **Thuộc tính lớp (Class attribute)**: Được định nghĩa trực tiếp trong thân class, dùng chung cho mọi đối tượng của lớp đó.\n\n```python\nclass Student:\n    school = \"PTIT\"  # Thuộc tính lớp\n    def __init__(self, name):\n        self.name = name # Thuộc tính đối tượng\n\nsv1 = Student(\"Binh\")\nsv2 = Student(\"Chi\")\nprint(sv1.school, sv2.school)\n# Output: PTIT PTIT\n```"},{"title":"Hiển thị đối tượng với __str__","source":"supplement","body":"Khi `print(doi_tuong)`, mặc định Python sẽ in ra địa chỉ bộ nhớ. Để in ra thông tin dễ đọc, ta ghi đè phương thức magic `__str__`.\n\n```python\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __str__(self):\n        return f\"Point({self.x}, {self.y})\"\n\np = Point(1, 2)\nprint(p)\n# Output: Point(1, 2)\n```"},{"title":"Kế thừa và super()","source":"textbook","body":"Lớp con có thể kế thừa các thuộc tính và phương thức từ lớp cha. Hàm `super()` giúp lớp con gọi phương thức của lớp cha (thường dùng nhất trong `__init__`).\n\n```python\nclass Person:\n    def __init__(self, name):\n        self.name = name\n\nclass Student(Person):\n    def __init__(self, name, gpa):\n        super().__init__(name) # Gọi init của Person\n        self.gpa = gpa\n\nsv = Student(\"Dung\", 3.2)\nprint(sv.name, sv.gpa)\n# Output: Dung 3.2\n```"},{"title":"Xử lý Danh sách Đối tượng (Sắp xếp và Lọc)","source":"exam","body":"Đề thi thực hành thường yêu cầu quản lý một danh sách đối tượng, sau đó lọc hoặc sắp xếp theo một tiêu chí (như GPA hoặc Tên).\n\n```python\nclass Student:\n    def __init__(self, name, gpa):\n        self.name = name\n        self.gpa = gpa\n\nds_sv = [Student(\"An\", 3.2), Student(\"Binh\", 3.8), Student(\"An\", 3.5)]\n\n# 1. Lọc sinh viên có GPA >= 3.5\nfiltered = [s for s in ds_sv if s.gpa >= 3.5]\n\n# 2. Sắp xếp theo gpa tăng dần, nếu gpa bằng nhau thì xếp theo tên\n# Dùng lambda trả về một tuple (tiêu chí 1, tiêu chí 2)\nsorted_sv = sorted(ds_sv, key=lambda s: (s.gpa, s.name))\n\nfor s in sorted_sv:\n    print(f\"{s.name}: {s.gpa}\")\n# Output:\n# An: 3.2\n# An: 3.5\n# Binh: 3.8\n```"},{"title":"Bẫy thường gặp khi thi","source":"exam","body":"- **Quên tham số self**: Trong định nghĩa hàm `def get_gpa(self):`, nếu thiếu `self`, khi gọi `sv.get_gpa()` sẽ bị lỗi truyền dư tham số.\n- **Nhầm lẫn giữa phương thức và thuộc tính**: `sv.gpa` (truy cập biến) khác với `sv.get_gpa()` (gọi hàm).\n- **Sắp xếp sai yêu cầu**: Đề bài yêu cầu sắp xếp theo Tên (First Name) nhưng sinh viên lại sắp xếp theo cả Họ Tên, hoặc quên xử lý trường hợp các giá trị bằng nhau.\n- **Lỗi AttributeError**: Do gõ sai tên thuộc tính được định nghĩa trong `__init__` khi thực hiện logic lọc/sắp xếp ở hàm bên ngoài."},{"title":"Checklist trước khi nộp bài","source":"exam","body":"- [ ] Mọi phương thức trong `class` đã có tham số đầu tiên là `self` chưa?\n- [ ] Các thuộc tính đã được gán qua `self.name = name` trong `__init__` chưa?\n- [ ] Hàm lọc đối tượng có trả về một `list` mới hay sửa trực tiếp list cũ (nên trả về list mới)?\n- [ ] Khi sử dụng `sorted()` với `lambda`, key đã truy cập đúng thuộc tính đối tượng chưa (ví dụ: `key=lambda x: x.gpa`)?\n- [ ] Đã kiểm tra trường hợp danh sách rỗng hoặc không có đối tượng nào thỏa mãn điều kiện lọc chưa?"}]},"T8":{"sections":[{"title":"Cơ chế Import và Quản lý Namespace","source":"textbook","body":"Trong Python, module là một file chứa các định nghĩa hàm và biến. Để sử dụng, ta dùng từ khóa **import**.\n- `import math`: Nạp cả module. Truy cập bằng `math.sqrt()` (Giữ sạch namespace).\n- `from math import sqrt, pi`: Nạp cụ thể thành phần. Dùng trực tiếp `sqrt()` (Dễ xung đột tên).\n- `import pandas as pd`: Đặt bí danh (alias) để viết code ngắn hơn.\n- `from math import *`: Nạp tất cả (Không khuyến khích vì dễ gây rối).\n\n```python\nimport math as m\nprint(m.pi) # Output: 3.141592653589793\n\nfrom math import gcd\nprint(gcd(12, 18)) # Output: 6\n```"},{"title":"Thư viện math: Xử lý toán học","source":"textbook","body":"Cung cấp các hàm số học cơ bản. Lưu ý kết quả của `sqrt` luôn là **float**.\n- `math.sqrt(x)`: Căn bậc hai.\n- `math.ceil(x)`: Làm tròn lên (số nguyên nhỏ nhất >= x).\n- `math.floor(x)`: Làm tròn xuống (số nguyên lớn nhất <= x).\n- `math.gcd(a, b)`: Ước chung lớn nhất.\n\n```python\nimport math\nprint(math.ceil(4.1))  # Output: 5\nprint(math.floor(4.9)) # Output: 4\nprint(math.sqrt(16))   # Output: 4.0\n```"},{"title":"Thư viện random: Tạo dữ liệu ngẫu nhiên","source":"textbook","body":"Quan trọng: `randint` bao gồm cả hai đầu mút, khác với `range` hay `randrange`.\n- `random.randint(a, b)`: Trả về số nguyên trong đoạn `[a, b]`.\n- `random.randrange(a, b)`: Trả về số nguyên trong khoảng `[a, b)`.\n- `random.choice(sequence)`: Chọn ngẫu nhiên 1 phần tử từ list/tuple.\n- `random.shuffle(list)`: Hoán vị ngẫu nhiên các phần tử **tại chỗ** (in-place) và trả về `None`.\n\n```python\nimport random\nitems = [1, 2, 3]\nrandom.shuffle(items)\nprint(items) # Output: [vị trí ngẫu nhiên]\nprint(random.randint(1, 3)) # Có thể ra 1, 2 hoặc 3\n```"},{"title":"Thư viện statistics: Thống kê cơ bản","source":"textbook","body":"Thường dùng để xử lý danh sách điểm số (GPA) hoặc dữ liệu từ file.\n- `statistics.mean(data)`: Trung bình cộng.\n- `statistics.median(data)`: Trung vị.\n- `statistics.mode(data)`: Giá trị xuất hiện nhiều nhất.\n\n```python\nimport statistics\ngpas = [3.2, 3.5, 3.2, 4.0]\nprint(statistics.mean(gpas))   # Output: 3.475\nprint(statistics.mode(gpas))   # Output: 3.2\n```"},{"title":"Thư viện datetime: Xử lý thời gian","source":"supplement","body":"Dùng để tính tuổi sinh viên hoặc quản lý ngày nhập học trong các bài tập Class.\n- `datetime.date.today()`: Lấy ngày hiện tại.\n- `date(year, month, day)`: Tạo đối tượng ngày.\n\n```python\nfrom datetime import date\ntoday = date(2024, 5, 20)\nbirth = date(2004, 5, 20)\nage = today.year - birth.year\nprint(age) # Output: 20\n```"},{"title":"Cấu trúc if __name__ == '__main__':","source":"textbook","body":"Dùng để phân biệt khi module được chạy trực tiếp hay bị import bởi file khác.\n- Khi chạy trực tiếp file: `__name__` sẽ có giá trị là `'__main__'`.\n- Khi bị import: Code bên dưới khối lệnh này sẽ **không** bị thực thi.\n\n```python\ndef my_func():\n    return \"Hello\"\n\nif __name__ == \"__main__\":\n    # Khối này chỉ chạy khi thực thi trực tiếp file này\n    print(my_func())\n```"},{"title":"Bẫy thường gặp khi thi","source":"exam","body":"- **Sai lầm với random.shuffle**: Viết `a = random.shuffle(my_list)` sẽ khiến `a` nhận giá trị `None`. Phải gọi hàm xong rồi mới dùng `my_list`.\n- **Nhầm lẫn đầu mút**: `random.randint(1, 5)` có thể ra 5, nhưng `random.randrange(1, 5)` thì không bao giờ ra 5.\n- **Lỗi NameError**: Sử dụng `sqrt()` mà chỉ `import math` thay vì `from math import sqrt`.\n- **Lỗi làm tròn**: Dùng `round()` của Python có cơ chế làm tròn đến số chẵn gần nhất (Banker's rounding), trong khi đề bài tính tiền nước thường yêu cầu làm tròn số học thuần túy hoặc dùng `math.ceil`/`math.floor`."},{"title":"Checklist trước khi nộp bài","source":"exam","body":"- [ ] Đã đặt tất cả lệnh `import` lên đầu file chưa?\n- [ ] Có dùng thư viện ngoài (như numpy, pandas) không? (Chỉ được dùng Standard Library).\n- [ ] Tên module có trùng với tên biến hay tên hàm không?\n- [ ] Nếu đề yêu cầu viết hàm, đã để các câu lệnh kiểm thử (test case) vào trong khối `if __name__ == '__main__':` chưa?\n- [ ] Các hàm `math` nhận vào giá trị hợp lệ chưa? (Ví dụ: `sqrt` không nhận số âm)."}]}}}</script>
<script>
"use strict";
const BANK = JSON.parse(document.getElementById('bank').textContent);
const HARNESS_SRC = "import sys, io, math, re, builtins, traceback, linecache\n\nUSER_FILE = '<bai_lam>'\nTEST_FILE = '<kiem_thu>'\nMAX_OUT = 20000\nVALUE_WORDS = {'true', 'false', 'none', 'yes', 'no', 'có', 'không', 'đúng', 'sai'}\n_TOKEN_RE = re.compile(r'-?\\d+(?:\\.\\d+)?|[^\\W\\d_]+')\n_NUM_RE = re.compile(r'-?\\d+(?:\\.\\d+)?\\Z')\n_CALL_RE = re.compile(r'^\\s*([A-Za-z_]\\w*)\\s*\\(')\n\n\ndef _cmp(a, b):\n    if isinstance(a, bool) or isinstance(b, bool):\n        return type(a) is type(b) and a == b\n    if isinstance(a, (int, float)) and isinstance(b, (int, float)):\n        if isinstance(a, float) or isinstance(b, float):\n            return math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-6)\n        return a == b\n    if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):\n        return type(a) is type(b) and len(a) == len(b) and all(_cmp(x, y) for x, y in zip(a, b))\n    if isinstance(a, dict) and isinstance(b, dict):\n        return a.keys() == b.keys() and all(_cmp(a[k], b[k]) for k in a)\n    return a == b\n\n\ndef _cmp_loose(a, b):\n    if isinstance(a, bool) or isinstance(b, bool):\n        return type(a) is type(b) and a == b\n    if isinstance(a, (int, float)) and isinstance(b, (int, float)):\n        return _cmp(a, b)\n    if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):\n        return len(a) == len(b) and all(_cmp_loose(x, y) for x, y in zip(a, b))\n    if isinstance(a, str) and isinstance(b, str):\n        return a == b or (bool(_tokens(b)) and _tokens(a) == _tokens(b))\n    if isinstance(a, dict) and isinstance(b, dict):\n        return a.keys() == b.keys() and all(_cmp_loose(a[k], b[k]) for k in a)\n    if isinstance(a, (set, frozenset)) and isinstance(b, (set, frozenset)):\n        return a == b\n    return a == b\n\n\ndef _tokens(s):\n    return _TOKEN_RE.findall(s.lower())\n\n\ndef _tok_eq(a, b):\n    if _NUM_RE.match(a) and _NUM_RE.match(b):\n        return math.isclose(float(a), float(b), rel_tol=1e-9, abs_tol=1e-6)\n    return a == b\n\n\ndef _toks_eq(xs, ys):\n    return len(xs) == len(ys) and all(_tok_eq(x, y) for x, y in zip(xs, ys))\n\n\ndef _match_stdout(got, expected):\n    if _norm(got) == _norm(expected):\n        return True, None\n    gt, et = _tokens(got), _tokens(expected)\n    if et and _toks_eq(gt, et):\n        return True, 'Đúng giá trị; khác cách trình bày (khoảng trắng/dấu câu/hoa thường).'\n    g_lines = [l for l in _norm(got).split(chr(10)) if l.strip()]\n    e_lines = [l for l in _norm(expected).split(chr(10)) if l.strip()]\n    if not e_lines or len(g_lines) != len(e_lines):\n        return False, None\n    e_all = set(et)\n    for gl, el in zip(g_lines, e_lines):\n        g, e = _tokens(gl), _tokens(el)\n        if not e:\n            if gl.rstrip() != el.rstrip():\n                return False, None\n            continue\n        if _toks_eq(g, e):\n            continue\n        k = len(g) - len(e)\n        if k <= 0 or not _toks_eq(g[k:], e):\n            return False, None\n        prefix = g[:k]\n        if any(_NUM_RE.match(w) or w in VALUE_WORDS or w in e_all for w in prefix):\n            return False, None\n    return True, 'Đúng giá trị; có thêm chữ mô tả trước kết quả.'\n\n\ndef _norm(s):\n    lines = [l.rstrip() for l in s.replace('\\r\\n', '\\n').split('\\n')]\n    while lines and lines[-1] == '':\n        lines.pop()\n    return '\\n'.join(lines)\n\n\ndef _register(name, src):\n    linecache.cache[name] = (len(src), None, src.splitlines(True), name)\n\n\ndef _fmt_exc(e):\n    if isinstance(e, SyntaxError):\n        txt = (e.text or '').strip()\n        where = f'Dòng {e.lineno}: {txt}\\n' if e.filename == USER_FILE else ''\n        return type(e).__name__, f'{where}{type(e).__name__}: {e.msg}'\n    frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == USER_FILE]\n    where = f'Dòng {frames[-1].lineno}: {(frames[-1].line or \"\").strip()}\\n' if frames else ''\n    return type(e).__name__, f'{where}{type(e).__name__}: {e}'\n\n\ndef _prep_files(files):\n    for name, content in (files or {}).items():\n        with open(name, 'w', encoding='utf-8') as f:\n            f.write(content)\n\n\ndef _exec(src, filename, ns, stdin=''):\n    out = io.StringIO()\n    inp = io.StringIO(stdin or '')\n\n    def fake_input(prompt=''):\n        line = inp.readline()\n        if line == '':\n            raise EOFError('chương trình gọi input() nhiều hơn số dòng dữ liệu nhập')\n        return line.rstrip('\\n').rstrip('\\r')\n\n    old = sys.stdout, sys.stdin, builtins.input\n    sys.stdout, sys.stdin, builtins.input = out, inp, fake_input\n    err = None\n    try:\n        _register(filename, src)\n        exec(compile(src, filename, 'exec'), ns)\n    except SystemExit:\n        pass\n    except BaseException as e:\n        err = _fmt_exc(e)\n    finally:\n        sys.stdout, sys.stdin, builtins.input = old\n    return out.getvalue()[:MAX_OUT], err\n\n\ndef run_program(src, stdin='', files=None):\n    _prep_files(files)\n    out, err = _exec(src, USER_FILE, {'__name__': '__main__'}, stdin)\n    return {'stdout': out, 'error': err[1] if err else None, 'errType': err[0] if err else None}\n\n\ndef run_tests(src, ex):\n    results = []\n    for t in ex['tests']:\n        _prep_files(ex.get('files'))\n        _prep_files(t.get('files'))\n        if ex['mode'] == 'stdio':\n            out, err = _exec(src, USER_FILE, {'__name__': '__main__'}, t.get('input', ''))\n            match_ok, note = _match_stdout(out, t['expected'])\n            ok = err is None and match_ok\n            results.append({'ok': ok, 'got': out, 'error': err[1] if err else None, 'errType': err[0] if err else None,\n                            'note': note if ok else None})\n            continue\n        ns = {'__name__': '__bai_lam__'}\n        out, err = _exec(src, USER_FILE, ns)\n        if err and err[0] != 'EOFError':\n            results.append({'ok': False, 'got': '', 'printed': out, 'error': err[1], 'errType': err[0], 'note': None})\n            continue\n        notes = []\n        alias = None\n        m = _CALL_RE.match(t['call'])\n        if m and m.group(1) not in ns and not hasattr(builtins, m.group(1)):\n            want = m.group(1)\n            mine = [(k, v) for k, v in ns.items()\n                    if isinstance(v, type(_cmp)) and v.__code__.co_filename == USER_FILE]\n            if len(mine) == 1:\n                alias = (want, mine[0][0], mine[0][1])\n                ns[want] = mine[0][1]\n        code = (t.get('setup') or '') + '\\n__ket_qua__ = (' + t['call'] + ')\\n'\n        out2, err2 = _exec(code, TEST_FILE, ns)\n        if err2:\n            results.append({'ok': False, 'got': '', 'printed': out2, 'error': err2[1], 'errType': err2[0], 'note': None})\n            continue\n        if alias and ns.get(alias[0]) is alias[2]:\n            notes.append(f'Tên hàm khác đề (đề yêu cầu `{alias[0]}`), đã chấm bằng hàm `{alias[1]}`.')\n        got = ns.get('__ket_qua__')\n        ok = False\n        try:\n            exp = eval(t['expected'], {})\n            if _cmp(got, exp):\n                ok = True\n            elif _cmp_loose(got, exp):\n                ok = True\n                notes.append('Đúng giá trị; khác kiểu list/tuple hoặc cách viết chuỗi.')\n            elif got is None and exp is not None:\n                pt = _tokens(out2)\n                if pt and (_toks_eq(pt, _tokens(str(exp))) or _toks_eq(pt, _tokens(repr(exp)))):\n                    ok = True\n                    notes.append('Hàm dùng print thay vì return; được chấp nhận, nhưng đề yêu cầu trả về (return) giá trị.')\n        except Exception:\n            ok = False\n        note = ' '.join(notes) if ok and notes else None\n        results.append({'ok': ok, 'got': repr(got), 'printed': out2, 'error': None, 'errType': None, 'note': note})\n    return results\n\n\ndef solution_output(src, ex, test):\n    \"\"\"Chạy lời giải qua một test (chưa có expected) để lấy giá trị thật.\n    Trả (ok, expected_str, reason); ok False thì expected_str None và reason nêu lý do.\n    expected_str đã được chấm lại và phải khớp chặt (ok, không note). Chạy trong thư mục tạm.\"\"\"\n    import os, tempfile\n    base = {k: v for k, v in ex.items() if k != 'tests'}\n    probe = {k: v for k, v in test.items() if k != 'expected'}\n    cwd = os.getcwd()\n    with tempfile.TemporaryDirectory() as d:\n        os.chdir(d)\n        try:\n            r = run_tests(src, {**base, 'tests': [{**probe, 'expected': 'None'}]})[0]\n            if r['error']:\n                return False, None, f\"lời giải bị lỗi: {r['error']}\"\n            if ex['mode'] == 'stdio':\n                expected = _norm(r['got'])\n            else:\n                if r.get('printed', '').strip():\n                    return False, None, 'lời giải có in ra màn hình'\n                expected = r['got']\n            r2 = run_tests(src, {**base, 'tests': [{**probe, 'expected': expected}]})[0]\n        finally:\n            os.chdir(cwd)\n    if not r2['ok']:\n        return False, None, f'giá trị trả về không eval lại được hoặc không bằng nhau: {expected}'\n    if r2['note']:\n        return False, None, f'expected không khớp chặt với lời giải (note: {r2[\"note\"]})'\n    return True, expected, None\n";
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const STORE_KEY = 'pyExamTrainer.v1';
const TOPICS = BANK.topics;
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const MCQ = BANK.mcq, CODING = BANK.coding;
const Q_BY_ID = Object.fromEntries(MCQ.map(q => [q.id, q]));
const C_BY_ID = Object.fromEntries(CODING.map(c => [c.id, c]));
const CAT = {theory:'Thiếu kiến thức lý thuyết',concept:'Hiểu sai bản chất',syntax:'Nhầm lẫn cú pháp',execution:'Không hiểu cách Python thực thi',logic:'Sai tư duy logic',edge:'Bỏ sót trường hợp biên',method:'Chọn sai phương pháp',implementation:'Code sai khi triển khai'};
const SRC = {textbook:'Giáo trình',exam:'Dạng đề cũ',supplement:'Bổ sung'};
const TYPE = {output:'Đọc code',replace:'Thay thế code',error:'Tìm lỗi',compare:'So sánh',theory:'Lý thuyết'};
const EXAM_TYPES = ['output','replace','error']; // dạng câu có trong đề thi thật (đọc code / thay thế code)
const SPEED_SEC = 24; // 50 câu trong 20 phút
const DIFF = {1:'Dễ',2:'Trung bình',3:'Khó'};
const STATUS = ['Not Started','Learning','Practicing','Weak','Reviewing','Mastered'];
const RULE = {mcqMin:15, window:10, acc:0.9, codeMin:3};
const ruleFor = t => TOPIC[t].priority === 1 ? RULE : {mcqMin:10, window:10, acc:0.9, codeMin:2};

/* ---------------- storage ---------------- */
const MOCK_DEFAULTS={mockMcq:50,mockMcqMin:20,mockCode:2,mockCodeMin:15,mcqWeight:50};
function defaults(){return {version:1,created:Date.now(),counter:0,q:{},c:{},errors:[],mocks:[],read:{},remedy:null,activeMock:null,speed:[],
  settings:Object.assign({theme:'auto',timeoutSec:8,settingsVer:2},MOCK_DEFAULTS)}}
/* Bản cũ (settingsVer 1) dùng cấu trúc đề tự suy ra: chuyển sang format thầy công bố. */
function migrate(){
  const st=S.settings;
  if(!st.settingsVer||st.settingsVer<2){Object.assign(st,MOCK_DEFAULTS);delete st.mockMinutes;st.settingsVer=2}
  if(S.activeMock&&!S.activeMock.phase)S.activeMock=null;
  if(!Array.isArray(S.speed))S.speed=[];
}
let S;
function load(){
  try{const raw=localStorage.getItem(STORE_KEY); S=raw?Object.assign(defaults(),JSON.parse(raw)):defaults();
    S.settings=Object.assign({},defaults().settings,{settingsVer:1},S.settings||{});migrate();}
  catch(e){S=defaults();}
}
let storageOk=true;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}}
load();
function applyTheme(){if(S.settings.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.settings.theme)}
applyTheme();

/* ---------------- helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b)=> b? Math.round(a*100/b) : 0;
const fmtDate = ts => new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weightedPick(items){const tot=items.reduce((s,x)=>s+x.w,0);if(!tot)return null;let r=Math.random()*tot;for(const x of items){r-=x.w;if(r<=0)return x.item}return items[items.length-1].item}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function md(src){
  const out=[],L=String(src||'').replace(/\r/g,'').split('\n');let i=0,para=[],list=[];
  const fp=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}};
  const fl=()=>{if(list.length){out.push('<ul>'+list.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>');list=[]}};
  while(i<L.length){const l=L[i];
    if(l.trim().startsWith('```')){fp();fl();const b=[];i++;while(i<L.length&&!L[i].trim().startsWith('```')){b.push(L[i]);i++}i++;out.push('<pre class="code">'+esc(b.join('\n'))+'</pre>');continue}
    if(/^\s*[-*] /.test(l)){fp();list.push(l.replace(/^\s*[-*] /,''));i++;continue}
    if(/^#{1,4} /.test(l)){fp();fl();out.push('<h4>'+inline(l.replace(/^#+ /,''))+'</h4>');i++;continue}
    if(!l.trim()){fp();fl();i++;continue}
    fl();para.push(l);i++}
  fp();fl();return out.join('');
}
const srcBadge = s => `<span class="badge src-${esc(s)}">${esc(SRC[s]||s)}</span>`;
function qBody(q,size=16,noQ=false){
  return `${noQ?'':`<div style="font-size:${size}px;margin:6px 0 4px">${inline(q.question)}</div>`}${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}${q.type==='replace'?`<div class="small muted" style="margin:-4px 0 2px">Kết quả mong muốn:</div><pre class="code expect">${q.expect?esc(q.expect):'(không in gì, chương trình chạy không lỗi)'}</pre>`:''}`}
const isPlain = q => q.type==='theory' || q.options.some(o=>o.length>60 && /\s[a-zà-ỹ]+\s/i.test(o) && !/[()\[\]=]/.test(o));

/* ---------------- stats & mastery ---------------- */
const qs = id => S.q[id] || (S.q[id] = {first:null,firstTs:0,attempts:0,spoiled:false,due:null,lastOk:null});
const peekQ = id => S.q[id] || {};
const peekC = id => S.c[id] || {};
const isSeen = q => peekQ(q.id).first !== null && peekQ(q.id).first !== undefined;
function topicStats(t){
  const rule=ruleFor(t);
  const firsts=MCQ.filter(q=>q.topic===t&&isSeen(q)&&!peekQ(q.id).spoiled).map(q=>({ok:peekQ(q.id).first,ts:peekQ(q.id).firstTs})).sort((a,b)=>a.ts-b.ts);
  const firstOk=firsts.filter(x=>x.ok).length;
  const win=firsts.slice(-rule.window);const winAcc=win.length?win.filter(x=>x.ok).length/win.length:0;
  const codes=CODING.filter(c=>c.topic===t);
  const indep=codes.filter(c=>peekC(c.id).indep);
  const indepHard=indep.some(c=>c.difficulty>=2);
  const openErr=S.errors.filter(e=>e.topic===t&&e.status!=='resolved').length;
  const unseen=MCQ.filter(q=>q.topic===t&&!isSeen(q)).length;
  const mcqOk=firsts.length>=rule.mcqMin&&winAcc>=rule.acc;
  const codeOk=indep.length>=rule.codeMin&&indepHard;
  const mastered=mcqOk&&codeOk&&openErr===0;
  const anyCode=codes.some(c=>peekC(c.id).subs);
  let st=0;
  if(mastered)st=5;
  else if(firsts.length>=5&&firstOk/firsts.length<0.6)st=3;
  else if(openErr>0)st=4;
  else if(firsts.length||anyCode)st=2;
  else if(S.read[t])st=1;
  return {rule,n:firsts.length,firstOk,acc:firsts.length?firstOk/firsts.length:null,winAcc,winN:win.length,indep:indep.length,indepHard,codeTotal:codes.length,openErr,unseen,mcqOk,codeOk,mastered,status:st,mcqTotal:MCQ.filter(q=>q.topic===t).length};
}
function globalStats(){
  let n=0,ok=0,att=0;
  for(const q of MCQ){const s=peekQ(q.id);if(s.first!==null&&s.first!==undefined){n++;if(s.first)ok++}att+=s.attempts||0}
  const indep=CODING.filter(c=>peekC(c.id).indep).length;
  const open=S.errors.filter(e=>e.status!=='resolved').length;
  const tagCount={};for(const e of S.errors)for(const t of e.tags||[])tagCount[t]=(tagCount[t]||0)+1;
  const topTags=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return {n,ok,att,indep,open,topTags,mastered:TOPICS.filter(t=>topicStats(t.id).mastered).length};
}
function nextStep(){
  const order=TOPICS.slice().sort((a,b)=>a.priority-b.priority);
  for(const t of order){const s=topicStats(t.id);if(s.mastered)continue;
    if(!S.read[t.id])return {t:t.id,text:`Đọc tài liệu ${t.id}: ${t.name}`,href:`#/learn/${t.id}`};
    if(s.openErr>0&&s.n>=5)return {t:t.id,text:`Ôn ${s.openErr} lỗi chưa khắc phục ở ${t.id}`,href:`#/review`};
    if(!s.mcqOk)return {t:t.id,text:`Luyện trắc nghiệm ${t.id} (${s.n}/${s.rule.mcqMin} câu, ${s.winN?Math.round(s.winAcc*100)+'% ở '+s.winN+' câu gần nhất':'chưa làm'})`,href:`#/quiz/${t.id}`};
    if(!s.codeOk)return {t:t.id,text:`Làm bài code ${t.id} (${s.indep}/${s.rule.codeMin} bài tự giải)`,href:`#/code?topic=${t.id}`};
    if(s.openErr>0)return {t:t.id,text:`Ôn lỗi ${t.id}`,href:'#/review'};
  }
  return {text:'Mọi chủ đề đã đạt. Làm một đề thi thử để kiểm tra lại.',href:'#/mock'};
}

/* ---------------- error log ---------------- */
function logError(o){
  let e=S.errors.find(x=>x.itemId===o.itemId&&x.status!=='resolved');
  if(e){e.count=(e.count||1)+1;e.ts=Date.now();e.mistake=o.mistake;if(o.category)e.category=o.category;return e}
  e=Object.assign({id:'E'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:Date.now(),status:'open',hits:0,count:1},o);
  S.errors.unshift(e);return e;
}
function creditTags(topic,tags,itemId){
  const hit=[];
  for(const e of S.errors){
    if(e.status==='resolved'||e.itemId===itemId||e.topic!==topic)continue;
    if(!(e.tags||[]).some(t=>tags.includes(t)))continue;
    if((e.hitItems||[]).includes(itemId))continue;
    e.hitItems=(e.hitItems||[]).concat(itemId);e.hits=(e.hits||0)+1;
    if(e.hits>=2){e.status='resolved';e.resolvedTs=Date.now()}else e.status='retesting';
    hit.push(e);
  }
  return hit;
}
const errStatus = e => e.status==='resolved'?'Đã khắc phục':e.status==='retesting'?`Đang kiểm tra lại (${e.hits}/2)`:'Chưa kiểm tra lại';

/* ---------------- adaptive selection ---------------- */
function targetDiff(t){const s=topicStats(t);if(s.n<3)return 1;const a=s.winAcc;return a<0.6?1:a<0.85?2:3}
function pickQuestion(cfg){
  const ex=cfg.exclude||new Set();
  let pool=MCQ.filter(q=>(!cfg.topic||q.topic===cfg.topic)&&!ex.has(q.id)&&(!cfg.types||cfg.types.includes(q.type)));
  if(cfg.tags)pool=pool.filter(q=>q.tags.some(t=>cfg.tags.includes(t)));
  if(!pool.length)return null;
  const rem=S.remedy;
  if(rem&&cfg.mode!=='review'&&!cfg.noRemedy){
    const cand=pool.filter(q=>!isSeen(q)&&q.tags.some(t=>rem.tags.includes(t)));
    if(cand.length){
      const best=cand.map(q=>({item:q,w:(q.topic===rem.topic?3:1)*(q.reserve?2:1)}));
      rem.left--;if(rem.left<=0)S.remedy=null;save();
      const pq=weightedPick(best);
      return {q:pq,why:(pq.reserve?'Câu dự phòng':'Câu mới')+' cùng kiến thức với câu bạn vừa sai'};
    }
    S.remedy=null;
  }
  const errTags=new Set(S.errors.filter(e=>e.status!=='resolved').flatMap(e=>e.tags||[]));
  const tw={},td={};
  for(const t of TOPICS){const s=topicStats(t.id);
    tw[t.id]=(1+(s.acc===null?0.3:(1-s.acc)*1.5)+0.4*Math.min(s.openErr,4))*(t.priority===1?1:0.6)*(s.mastered?0.4:1);
    td[t.id]=targetDiff(t.id)}
  const scored=pool.map(q=>{const st=peekQ(q.id);let w,why;
    const due=st.due!==null&&st.due!==undefined&&S.counter>=st.due;
    if(cfg.mode==='review'){
      if(due){w=5;why='Câu đến hạn ôn lại'}else if(isSeen(q)&&st.lastOk===false){w=3;why='Câu đã từng sai'}
      else if(!isSeen(q)&&q.tags.some(t=>errTags.has(t))){w=2.5;why='Câu mới cùng kiến thức với lỗi chưa khắc phục'}
      else return null;
    }else if(due){w=4.5;why='Câu đến hạn ôn lại'}
    else if(!isSeen(q)){w=q.reserve?0.8:3;why=q.reserve?'Câu dự phòng':'Câu chưa làm';if(q.tags.some(t=>errTags.has(t))){w*=1.4;why+=', liên quan lỗi đang mở'}if(st.spoiled)w*=0.3}
    else{w=0.15;why='Ôn lại (đã hết câu mới)'}
    if(!cfg.topic)w*=tw[q.topic];
    w*=[1,0.6,0.35][Math.abs(q.difficulty-td[q.topic])]||0.35;
    return {item:q,w,why}}).filter(Boolean);
  if(!scored.length)return null;
  const strong=scored.filter(x=>x.why!=='Ôn lại (đã hết câu mới)');
  const use=strong.length?strong:scored;
  const q=weightedPick(use);
  return {q,why:use.find(x=>x.item===q).why};
}

/* ---------------- Pyodide worker ---------------- */
const WORKER_SRC = `
const HARNESS = ${JSON.stringify(HARNESS_SRC)};
let py=null, ready=null;
async function init(){
  importScripts('${PYODIDE_URL}pyodide.js');
  py = await loadPyodide({indexURL:'${PYODIDE_URL}'});
  py.runPython(HARNESS);
  py.runPython('import json, os, tempfile');
}
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (!ready) ready = init();
    await ready;
    if (m.type === 'init') { self.postMessage({id:m.id, ok:true}); return; }
    py.globals.set('__payload__', JSON.stringify(m.payload));
    const fn = m.type === 'run' ? 'run_program(p["src"], p.get("stdin",""), p.get("files"))' : 'run_tests(p["src"], p["ex"])';
    const out = py.runPython('os.chdir(tempfile.mkdtemp())\\np = json.loads(__payload__)\\njson.dumps(' + fn + ')');
    self.postMessage({id:m.id, ok:true, result: JSON.parse(out)});
  } catch (err) {
    self.postMessage({id:m.id, ok:false, error: String(err && err.message || err)});
  }
};`;
const Py = {
  worker:null, ready:null, status:'idle', error:'', seq:0, pending:new Map(),
  setStatus(s,err){this.status=s;this.error=err||'';renderPyStatus();document.dispatchEvent(new Event('pystatus'))},
  start(){
    if(this.ready)return this.ready;
    this.setStatus('loading');
    try{
      this.worker=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})));
    }catch(e){this.setStatus('error','Trình duyệt không cho tạo Web Worker: '+e.message);return Promise.reject(e)}
    this.worker.onmessage=e=>{const p=this.pending.get(e.data.id);if(p){this.pending.delete(e.data.id);p(e.data)}};
    this.worker.onerror=e=>{e.preventDefault();const msg='Không tải được Pyodide. Cần kết nối Internet ở lần chạy code đầu tiên.';
      for(const [,p] of this.pending)p({ok:false,error:msg});this.pending.clear();this.kill();this.setStatus('error',msg)};
    this.ready=this.call('init',{},180000).then(r=>{if(!r.ok){throw new Error(r.timeout?'Tải Pyodide quá lâu (180 giây).':r.error)}this.setStatus('ready')})
      .catch(err=>{this.kill();this.setStatus('error',String(err.message||err));throw err});
    return this.ready;
  },
  call(type,payload,ms){return new Promise(res=>{const id=++this.seq;const t=setTimeout(()=>{this.pending.delete(id);res({ok:false,timeout:true})},ms);
    this.pending.set(id,d=>{clearTimeout(t);res(d)});this.worker.postMessage({id,type,payload})})},
  kill(){if(this.worker)this.worker.terminate();this.worker=null;this.ready=null},
  async exec(type,payload,ms){
    try{await this.start()}catch(e){return {ok:false,error:this.error||String(e)}}
    const r=await this.call(type,payload,ms||S.settings.timeoutSec*1000);
    if(r.timeout){this.kill();this.setStatus('idle');return {ok:false,timeout:true,error:`Quá thời gian ${Math.round((ms||S.settings.timeoutSec*1000)/1000)} giây. Có thể chương trình bị lặp vô hạn hoặc đang chờ input() mà không có dữ liệu.`}}
    return r;
  }
};
function renderPyStatus(){const el=$('#pystatus');if(!el)return;
  const m={idle:'Python: chưa tải',loading:'Python: đang tải…',ready:'Python: sẵn sàng',error:'Python: lỗi tải'};
  el.textContent=m[Py.status]+(navigator.onLine?'':' (offline)');}
window.addEventListener('online',renderPyStatus);window.addEventListener('offline',renderPyStatus);

/* ---------------- editor ---------------- */
function editorHTML(id,value){return `<div class="editor"><div class="gut" id="${id}-gut">1</div><textarea id="${id}" class="ed" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(value)}</textarea></div>`}
function bindEditor(id,onChange,onRun){
  const ta=$('#'+id),gut=$('#'+id+'-gut');
  const sync=()=>{const n=ta.value.split('\n').length;gut.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');gut.scrollTop=ta.scrollTop};
  ta.addEventListener('input',()=>{sync();onChange&&onChange(ta.value)});ta.addEventListener('scroll',()=>{gut.scrollTop=ta.scrollTop});
  ta.addEventListener('keydown',e=>{
    const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();onRun&&onRun();return}
    if(e.key==='Tab'){e.preventDefault();
      const ls=v.lastIndexOf('\n',s-1)+1;
      if(e.shiftKey){const ln=v.slice(ls);const m=ln.match(/^ {1,4}/);if(m){ta.value=v.slice(0,ls)+v.slice(ls+m[0].length);ta.selectionStart=ta.selectionEnd=Math.max(ls,s-m[0].length)}}
      else if(s!==en&&v.slice(s,en).includes('\n')){const block=v.slice(ls,en).split('\n').map(l=>'    '+l).join('\n');ta.value=v.slice(0,ls)+block+v.slice(en);ta.selectionStart=ls;ta.selectionEnd=ls+block.length}
      else{ta.setRangeText('    ',s,en,'end')}
      ta.dispatchEvent(new Event('input'));return}
    if(e.key==='Enter'){const ls=v.lastIndexOf('\n',s-1)+1;const line=v.slice(ls,s);let ind=line.match(/^\s*/)[0];if(/:\s*$/.test(line))ind+='    ';
      e.preventDefault();ta.setRangeText('\n'+ind,s,en,'end');ta.dispatchEvent(new Event('input'))}
  });
  sync();return ta;
}

    list.innerHTML=`<div class="small muted" style="margin:6px 0">${items.length} câu</div>`+items.map(q=>{const s=peekQ(q.id);
      const stat=isSeen(q)?(s.first?'<span class="st st-5">Đúng lần đầu</span>':'<span class="st st-3">Sai lần đầu</span>'):s.spoiled?'<span class="st st-4">Đã xem đáp án</span>':'<span class="st st-0">Chưa làm</span>';
      return `<details class="card" style="padding:12px 16px"><summary style="cursor:pointer;list-style:none"><div class="row"><code>${q.id}</code><span style="flex:1">${esc(q.question)}</span>${q.reserve?'<span class="badge">dự phòng</span>':''}<span class="badge">${TYPE[q.type]}</span><span class="badge">${DIFF[q.difficulty]}</span>${stat}</div></summary>
      ${qBody(q,14,true)}<ol type="A" style="margin:6px 0 10px">${q.options.map(o=>`<li><code style="white-space:pre-wrap">${esc(o)}</code></li>`).join('')}</ol>
      <div class="small muted">Tags: ${q.tags.map(esc).join(', ')} · ${srcBadge(q.source)}</div>
      <div class="ans" data-id="${q.id}">${isSeen(q)||s.spoiled?answerBlock(q):`<button class="reveal" data-id="${q.id}" style="margin-top:8px">Hiện đáp án</button>`}</div></details>`}).join('');
    $$('.reveal',list).forEach(b=>b.onclick=()=>{const q=Q_BY_ID[b.dataset.id];
      if(!confirm('Câu này chưa làm. Xem đáp án thì câu sẽ không được tính vào điều kiện thành thạo. Vẫn xem?'))return;
      qs(q.id).spoiled=true;save();b.parentElement.innerHTML=answerBlock(q)});
  };
  $$('select,input',v).forEach(el=>el.addEventListener('input',draw));draw();
}
const answerBlock=q=>`<div class="fb ok" style="margin-top:8px">Đáp án: ${'ABCD'[q.answer]}<div class="body">${inline(q.explanation)}</div></div>`;
function codeBadge(c){const s=peekC(c.id);if(s.indep)return '<span class="st st-5">Tự giải</span>';if(s.passed)return '<span class="st st-4">Đạt (có trợ giúp)</span>';if(s.subs)return '<span class="st st-3">Chưa đạt</span>';return '<span class="st st-0">Chưa làm</span>'}

/* ---------------- Quiz ---------------- */
let session=null;
function newSession(cfg){session={cfg,count:0,firstOk:0,asked:new Set(),cur:null};}
function viewQuiz(v,[tid],params){
  const mode=params.get('mode')||'practice';const tags=params.get('tags')?params.get('tags').split(','):null;
  const topic=tid&&TOPIC[tid]?tid:'';
  const key=JSON.stringify([mode,topic,tags]);
  if(!session||session.key!==key){newSession({mode,topic,tags});session.key=key}
  const title=mode==='review'?'Ôn tập':tags?'Ôn theo lỗi':'Trắc nghiệm';
  v.innerHTML=`<h1>${title}</h1><p class="sub">${mode==='review'?'Câu đến hạn, câu đã sai và câu mới cùng kiến thức với lỗi đang mở.':tags?'Luyện các câu cùng kiến thức: '+tags.map(esc).join(', '):'Hệ thống tự chọn câu dựa trên chủ đề yếu, lỗi cũ, độ khó và câu chưa làm.'}</p>
  ${mode==='practice'&&!tags?`<div class="row" style="margin-bottom:12px"><span class="small muted">Chủ đề:</span><a href="#/quiz"><button class="${!topic?'primary':''}">Tự động</button></a>${TOPICS.map(t=>`<a href="#/quiz/${t.id}"><button class="${t.id===topic?'primary':''}" title="${esc(t.name)}">${t.id}</button></a>`).join('')}</div>`:''}
  <div class="row small muted" style="margin-bottom:8px"><span id="sess"></span><span class="spacer"></span><span class="kbd">Phím 1–4 hoặc A–D để chọn, Enter để nộp / sang câu</span></div>
  <div class="card" id="qcard"></div>`;
  nextQuestion();
  const onKey=e=>{if((e.target.matches&&e.target.matches('input,textarea,select')))return;const k=e.key.toLowerCase();
    const idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k);
    if(idx>=0&&k.length===1){const b=$$('.opt')[idx];b&&b.click()}
    else if(e.key==='Enter'){const nb=$('#next');if(nb&&nb.offsetParent){nb.click()}else{const sb=$('#submit');sb&&sb.offsetParent&&sb.click()}}};
  document.addEventListener('keydown',onKey);cleanup=()=>document.removeEventListener('keydown',onKey);
}
function nextQuestion(){
  const c=session.cfg;
  if(session.cur&&!session.cur.done){renderQuestion();return}
  const p=pickQuestion({topic:c.topic,mode:c.mode,tags:c.tags,exclude:session.asked});
  if(!p){$('#qcard').innerHTML=`<div class="empty">${c.mode==='review'?'Không còn câu nào cần ôn. ':'Đã hết câu trong phạm vi này. '}<a href="#/dashboard">Về Dashboard</a></div>`;updSess();return}
  session.asked.add(p.q.id);
  session.cur={q:p.q,why:p.why,sel:-1,tries:0,wrong:[],done:false,isFirst:!isSeen(p.q)};
  renderQuestion();
}
function updSess(){const el=$('#sess');if(el)el.textContent=`Phiên này: ${session.count} câu, đúng lần đầu ${session.firstOk}`}
function renderQuestion(){
  const cur=session.cur,q=cur.q;updSess();
  const plain=isPlain(q);
  $('#qcard').innerHTML=`<div class="row" style="margin-bottom:8px"><span class="badge">${q.topic} · ${esc(TOPIC[q.topic].name)}</span><span class="badge">${TYPE[q.type]}</span><span class="badge">${DIFF[q.difficulty]}</span>${srcBadge(q.source)}<span class="spacer"></span><span class="small muted">${esc(cur.why)}${cur.isFirst?'':' · đã từng làm, không tính thành thạo'}</span></div>
  ${qBody(q)}
  <div id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="t ${plain?'plain':''}">${esc(o)}</span></button>`).join('')}</div>
  <div id="qerr" class="small" style="color:var(--bad);min-height:18px"></div><div id="qfb"></div>
  <div class="row"><button class="primary" id="submit">Nộp đáp án</button><button id="next" style="display:none">Câu tiếp theo</button><span class="spacer"></span><code class="small muted">${q.id}</code></div>`;
  paintOpts();
  $$('.opt').forEach(b=>b.onclick=()=>{if(cur.done)return;const i=+b.dataset.i;if(cur.wrong.includes(i))return;cur.sel=i;$('#qerr').textContent='';paintOpts()});
  $('#submit').onclick=submitAnswer;$('#next').onclick=()=>{nextQuestion()};
  if(cur.done)finishView();else if(cur.tries===1)hintView();
}
function paintOpts(){const cur=session.cur;$$('.opt').forEach(b=>{const i=+b.dataset.i;b.className='opt'+(cur.wrong.includes(i)?' wrong':'')+(cur.done&&i===cur.q.answer?' right':'')+(!cur.done&&i===cur.sel?' sel':'')})}
function hintView(){const q=session.cur.q;$('#qfb').innerHTML=`<div class="fb warn"><strong>Chưa đúng.</strong> Gợi ý:<div class="body">${inline(q.hint)}</div><div class="body small muted">Hãy chọn lại một phương án khác.</div></div>`}
function finishView(){const cur=session.cur,q=cur.q;const ok=cur.result!=='wrong';
  $('#qfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><strong>${cur.result==='first'?'Đúng ngay lần đầu.':cur.result==='second'?'Đúng ở lần thứ hai (sau gợi ý).':'Vẫn chưa đúng. Đáp án là '+'ABCD'[q.answer]+'.'}</strong><div class="body">${inline(q.explanation)}</div>
  ${cur.credited&&cur.credited.length?`<div class="body small">Tiến triển khắc phục lỗi: ${cur.credited.map(e=>esc(e.itemId)+' → '+errStatus(e)).join('; ')}</div>`:''}
  ${!ok||cur.result==='second'?`<div class="body small muted">Đã ghi vào Error Log (${esc(CAT[q.errorCategory]||q.errorCategory)}). Câu tiếp theo sẽ ưu tiên kiến thức này.</div>`:''}</div>`;
  $('#submit').style.display='none';$('#next').style.display='';paintOpts();
}
function submitAnswer(){
  const cur=session.cur,q=cur.q;
  if(cur.sel<0){$('#qerr').textContent='Chọn một phương án trước khi nộp.';return}
  const st=qs(q.id);
  if(cur.sel===q.answer){
    cur.done=true;cur.result=cur.tries?'second':'first';
    if(cur.tries===0){
      if(cur.isFirst){st.first=true;st.firstTs=Date.now();session.firstOk++;cur.credited=creditTags(q.topic,q.tags,q.id)}
      st.due=null;st.lastOk=true;
    }else{st.lastOk=false;st.due=S.counter+5}
    st.attempts++;S.counter++;session.count++;save();finishView();return}
  cur.wrong.push(cur.sel);cur.tries++;
  if(cur.tries===1){
    if(cur.isFirst){st.first=false;st.firstTs=Date.now()}
    st.lastOk=false;
    logError({topic:q.topic,itemId:q.id,kind:'mcq',question:q.question+(q.code?'\n'+q.code:''),mistake:`Chọn ${'ABCD'[cur.sel]}: ${q.options[cur.sel]}`,category:q.errorCategory,tags:q.tags,rootCause:`${CAT[q.errorCategory]||''}. ${q.hint}`,correct:q.explanation});
    S.remedy={tags:q.tags,topic:q.topic,left:2};
    cur.sel=-1;save();paintOpts();hintView();return}
  cur.done=true;cur.result='wrong';st.attempts++;st.due=S.counter+4;S.counter++;session.count++;
  const e=S.errors.find(x=>x.itemId===q.id&&x.status!=='resolved');if(e)e.mistake+=` → lần 2 chọn ${'ABCD'[cur.sel]}: ${q.options[cur.sel]}`;
  save();finishView();
}

/* ---------------- Speed drill ----------------
   Luyện nhịp đề thật: mỗi câu có đồng hồ riêng (mặc định 24 giây = 20 phút / 50 câu).
   Chọn là chốt luôn (không có lượt 2), hết giờ tính là bỏ trống. Kết quả lần đầu vẫn tính vào thống kê thành thạo. */
let speed=null,speedTimer=null;
function viewSpeed(v,[tid]){
  clearInterval(speedTimer);
  const onKey=e=>{if(!speed||!speed.active||!speed.cur||speed.cur.done||(e.target.matches&&e.target.matches('input,textarea,select')))return;const k=e.key.toLowerCase();
    const idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k);if(idx>=0&&k.length===1)speedAnswer(idx)};
  document.addEventListener('keydown',onKey);cleanup=()=>{clearInterval(speedTimer);document.removeEventListener('keydown',onKey)};
  if(speed&&speed.active)return drawSpeed(v);
  const hist=(S.speed||[]).slice(-5).reverse();
  const topic=tid&&TOPIC[tid]?tid:'';
  v.innerHTML=`<h1>Luyện tốc độ</h1><p class="sub">Đề thật: 50 câu trong 20 phút, tức khoảng ${SPEED_SEC} giây một câu. Mỗi câu có đồng hồ riêng; chọn là chốt, hết giờ tính là bỏ trống. Chỉ dùng câu dạng đọc code, thay thế code và tìm lỗi.</p>
  <div class="card">
    <div class="row" style="margin-bottom:10px"><span class="small muted" style="min-width:90px">Chủ đề</span><a href="#/speed"><button class="${!topic?'primary':''}">Trộn</button></a>${TOPICS.map(t=>`<a href="#/speed/${t.id}"><button class="${t.id===topic?'primary':''}" title="${esc(t.name)}">${t.id}</button></a>`).join('')}</div>
    <div class="row" style="margin-bottom:10px"><span class="small muted" style="min-width:90px">Số câu</span>${[10,20,50].map(n=>`<label class="row" style="gap:4px"><input type="radio" name="sp-n" value="${n}" ${n===10?'checked':''}>${n}</label>`).join('')}</div>
    <div class="row" style="margin-bottom:12px"><span class="small muted" style="min-width:90px">Giây / câu</span>${[35,24,18].map(s=>`<label class="row" style="gap:4px"><input type="radio" name="sp-s" value="${s}" ${s===SPEED_SEC?'checked':''}>${s}${s===SPEED_SEC?' (nhịp đề)':s>SPEED_SEC?' (khởi động)':' (dư giờ soát lại)'}</label>`).join('')}</div>
    <button class="primary" id="sp-start">Bắt đầu</button></div>
  ${hist.length?`<h2>Các lượt gần đây</h2><div class="card tblwrap" style="padding:6px 8px"><table><thead><tr><th>Lúc</th><th>Chủ đề</th><th>Đúng</th><th>TB giây/câu</th><th>Hết giờ</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${fmtDate(h.ts)}</td><td>${h.topic||'Trộn'}</td><td>${h.ok}/${h.n}</td><td>${h.avg.toFixed(1)} / ${h.sec}</td><td>${h.timeouts}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  $('#sp-start').onclick=()=>{
    const n=+$('input[name=sp-n]:checked').value,sec=+$('input[name=sp-s]:checked').value;
    speed={active:true,topic,n,sec,asked:new Set(),items:[],cur:null};speedNext();drawSpeed(v)};
}
function speedNext(){
  const p=pickQuestion({topic:speed.topic,types:EXAM_TYPES,exclude:speed.asked,noRemedy:true});
  if(!p||speed.items.length>=speed.n){speed.cur=null;return}
  speed.asked.add(p.q.id);
  speed.cur={q:p.q,start:Date.now(),sel:null,done:false,isFirst:!isSeen(p.q)};
}
function speedAnswer(sel){
  const cur=speed.cur;if(!cur||cur.done)return;
  clearInterval(speedTimer);
  cur.done=true;cur.sel=sel;cur.sec=Math.min(speed.sec,(Date.now()-cur.start)/1000);
  const q=cur.q,ok=sel===q.answer,st=qs(q.id);
  if(cur.isFirst){st.first=ok;st.firstTs=Date.now();if(ok)cur.credited=creditTags(q.topic,q.tags,q.id)}
  st.attempts++;st.lastOk=ok;S.counter++;
  if(ok)st.due=null;
  else{st.due=S.counter+4;logError({topic:q.topic,itemId:q.id,kind:'mcq',question:q.question+(q.code?'\n'+q.code:''),
    mistake:sel===null?`Hết ${speed.sec} giây chưa chọn (luyện tốc độ)`:`Chọn ${'ABCD'[sel]}: ${q.options[sel]} (luyện tốc độ)`,category:q.errorCategory,tags:q.tags,rootCause:`${CAT[q.errorCategory]||''}. ${q.hint}`,correct:q.explanation})}
  speed.items.push({id:q.id,ok,sel,sec:cur.sec});save();drawSpeed($('#view'));
}
function drawSpeed(v){
  clearInterval(speedTimer);
  const cur=speed.cur;
  if(!cur){return speedSummary(v)}
  const q=cur.q,plain=isPlain(q),i=speed.items.length+(cur.done?0:1);
  v.innerHTML=`<div class="row" style="margin-bottom:8px"><h1 style="margin:0">Luyện tốc độ</h1><span class="spacer"></span><span class="small muted">Câu ${Math.min(i,speed.n)}/${speed.n} · đúng ${speed.items.filter(x=>x.ok).length}</span><span class="timer" id="sp-t"></span><button id="sp-stop">Dừng</button></div>
  <div class="bar" style="height:6px;margin-bottom:10px"><i id="sp-bar" style="width:100%;transition:width 1s linear"></i></div>
  <div class="card"><div class="row" style="margin-bottom:6px"><span class="badge">${q.topic}</span><span class="badge">${TYPE[q.type]}</span><span class="badge">${DIFF[q.difficulty]}</span></div>${qBody(q)}
  ${q.options.map((o,k)=>`<button class="opt ${cur.done&&k===q.answer?'right':''} ${cur.done&&k===cur.sel&&k!==q.answer?'wrong':''}" data-i="${k}"><span class="k">${'ABCD'[k]}</span><span class="t ${plain?'plain':''}">${esc(o)}</span></button>`).join('')}
  <div id="sp-fb"></div></div>`;
  $('#sp-stop').onclick=()=>{clearInterval(speedTimer);speed.cur=null;speedSummary(v)};
  if(!cur.done){
    $$('.opt',v).forEach(b=>b.onclick=()=>speedAnswer(+b.dataset.i));
    const t=()=>{const left=speed.sec*1000-(Date.now()-cur.start);
      if(left<=0){speedAnswer(null);return}
      const el=$('#sp-t');if(el){el.textContent=Math.ceil(left/1000)+'s';el.style.color=left<6000?'var(--bad)':''}
      const b=$('#sp-bar');if(b)b.style.width=Math.max(0,left/(speed.sec*10))+'%'};
    t();speedTimer=setInterval(t,250);
  }else{
    const ok=cur.sel===q.answer;
    $('#sp-t').textContent=cur.sec.toFixed(1)+'s';$('#sp-bar').style.width='0%';
    $('#sp-fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><strong>${ok?'Đúng':cur.sel===null?'Hết giờ. Đáp án: '+'ABCD'[q.answer]:'Sai. Đáp án: '+'ABCD'[q.answer]}</strong> <span class="small muted">· ${cur.sec.toFixed(1)} giây${cur.isFirst?'':' · đã từng làm, không tính thành thạo'}</span><div class="body">${inline(q.explanation)}</div></div>
      <div class="row"><button class="primary" id="sp-next">${speed.items.length>=speed.n?'Xem kết quả':'Câu tiếp (Enter)'}</button></div>`;
    $('#sp-next').onclick=()=>{speedNext();drawSpeed(v)};$('#sp-next').focus();
  }
}
function speedSummary(v){
  clearInterval(speedTimer);
  const it=speed.items;
  if(speed.active&&it.length){
    const rec={ts:Date.now(),topic:speed.topic,n:it.length,ok:it.filter(x=>x.ok).length,avg:it.reduce((s,x)=>s+x.sec,0)/it.length,timeouts:it.filter(x=>x.sel===null).length,sec:speed.sec};
    S.speed=(S.speed||[]).concat(rec).slice(-30);save();
  }
  speed.active=false;
  if(!it.length){speed=null;location.hash='#/speed';route();return}
  const ok=it.filter(x=>x.ok).length,avg=it.reduce((s,x)=>s+x.sec,0)/it.length,slow=it.filter(x=>x.sec>=speed.sec*0.8);
  const proj=Math.round(50*avg);
  v.innerHTML=`<h1>Kết quả luyện tốc độ</h1><p class="sub">${it.length} câu · ${speed.sec} giây/câu${speed.topic?' · '+speed.topic:''}</p>
  <div class="grid"><div class="metric"><div class="l">Đúng</div><div class="v">${ok}/${it.length}</div><div class="d">${pct(ok,it.length)}%</div></div>
  <div class="metric"><div class="l">Trung bình mỗi câu</div><div class="v">${avg.toFixed(1)}s</div><div class="d">50 câu sẽ mất khoảng ${Math.floor(proj/60)} phút ${proj%60} giây (giới hạn 20 phút)</div></div>
  <div class="metric"><div class="l">Hết giờ</div><div class="v">${it.filter(x=>x.sel===null).length}</div><div class="d">${slow.length} câu dùng trên 80% thời gian</div></div></div>
  <div class="card"><strong>Nhận xét</strong><div class="md">${md([
    avg>SPEED_SEC?`- Bạn đang chậm hơn nhịp đề (${avg.toFixed(1)}s > ${SPEED_SEC}s). Câu nào đọc 15 giây chưa ra thì chọn tạm, đánh dấu, quay lại sau.`:`- Tốc độ đạt nhịp đề (${avg.toFixed(1)}s ≤ ${SPEED_SEC}s).`,
    pct(ok,it.length)<80?'- Độ chính xác dưới 80%: xem lại các câu sai trong Error Log trước khi tăng tốc.':'- Độ chính xác tốt. Thử giảm xuống 18 giây/câu để có thời gian soát lại khi thi thật.'].join('\n'))}</div>
  <div class="row"><button class="primary" id="sp-again">Luyện lượt mới</button><a href="#/review"><button>Ôn lỗi</button></a></div></div>
  <h2>Chi tiết</h2>${it.map((x,k)=>{const q=Q_BY_ID[x.id];return `<details class="card" style="padding:12px 16px"><summary style="cursor:pointer"><span class="st ${x.ok?'st-5':'st-3'}">${x.ok?'Đúng':x.sel===null?'Hết giờ':'Sai'}</span> Câu ${k+1} · ${x.sec.toFixed(1)}s · ${esc(q.question)} <code class="small">${q.id}</code></summary>${qBody(q,14,true)}
    <div class="small">Bạn chọn: ${x.sel===null?'không chọn':'ABCD'[x.sel]+'. '+esc(q.options[x.sel])}<br>Đáp án: ${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</div><div class="fb ${x.ok?'ok':'bad'}"><div class="body">${inline(q.explanation)}</div></div></details>`}).join('')}`;
  $('#sp-again').onclick=()=>{const t=speed.topic;speed=null;location.hash=t?'#/speed/'+t:'#/speed';route()};
}

/* ---------------- Coding lab ---------------- */
function viewCode(v,[cid],params){
  if(cid&&C_BY_ID[cid])return viewExercise(v,C_BY_ID[cid]);
  const tf=params.get('topic')||'';
  const items=CODING.filter(c=>!tf||c.topic===tf);
  v.innerHTML=`<h1>Coding Lab</h1><p class="sub">Viết code, chạy thử và nộp để chấm với bộ test. Code chạy bằng Pyodide ngay trong trình duyệt; lần đầu cần Internet để tải (khoảng 10 MB).</p>
  <div class="row" style="margin-bottom:12px"><a href="#/code"><button class="${!tf?'primary':''}">Tất cả</button></a>${TOPICS.map(t=>`<a href="#/code?topic=${t.id}"><button class="${t.id===tf?'primary':''}">${t.id}</button></a>`).join('')}</div>
  ${items.map(c=>`<a href="#/code/${c.id}" style="color:inherit;text-decoration:none"><div class="list-item"><code>${c.id}</code><div style="flex:1">${esc(c.title)}<div class="small muted">${esc(TOPIC[c.topic].name)}${c.reserve?' · bài dự phòng':''}</div></div>${srcBadge(c.source)}<span class="badge">${DIFF[c.difficulty]}</span>${codeBadge(c)}</div></a>`).join('')}`;
}
function exerciseInfo(c,showTests){

}
function codeErrCategory(list,kind){
  if(kind==='timeout')return 'logic';
  const e=list.find(x=>x.errType);if(!e)return null;
  if(['SyntaxError','IndentationError','TabError'].includes(e.errType))return 'syntax';
  if(['NameError','AttributeError','TypeError','UnboundLocalError'].includes(e.errType))return 'implementation';
  if(['IndexError','KeyError','ZeroDivisionError','ValueError','FileNotFoundError','EOFError'].includes(e.errType))return 'edge';
  return 'execution';
}
function recordSubmission(c,st,list,kind){
  st.subs++;const pass=list.filter(x=>x.ok).length,total=c.tests.length;
  st.history.push({ts:Date.now(),pass,total});if(st.history.length>30)st.history.shift();
  if(kind!=='timeout'&&pass===total){
    if(!st.passed){st.passed=true;st.passedTs=Date.now();
      if(!st.hint&&!st.solution){st.indep=true;creditTags(c.topic,c.tags,c.id)}}
    const variant=CODING.find(x=>x.id!==c.id&&x.topic===c.topic&&!peekC(x.id).passed&&x.tags.some(t=>c.tags.includes(t)));st.variant=variant?variant.id:null;
  }else{
    const first=list.findIndex(x=>!x.ok);
    const cat=codeErrCategory(list,kind)||c.errorCategory;
    logError({topic:c.topic,itemId:c.id,kind:'code',question:c.title,mistake:kind==='timeout'?'Chạy quá thời gian':`${pass}/${total} test đạt; test ${first+1} sai${list[first]&&list[first].errType?' ('+list[first].errType+')':''}`,category:cat,tags:c.tags,rootCause:CAT[cat]||cat,correct:(c.commonMistakes||[]).join(' · ')||c.hint});
  }
  save();
}

/* ---------------- Mock exam ----------------
   Format theo thầy công bố: phần 1 trắc nghiệm (50 câu / 20 phút, đọc code hoặc thay thế code),
   phần 2 lập trình (2 bài / 15 phút, thao tác trên list và dict). Hai phần tính giờ riêng. */
const MOCK_MIX={T1:7,T2:7,T3:8,T4:8,T5:6,T6:5,T7:5,T8:4};
function buildMock(){
  const st=S.settings,nM=st.mockMcq,nC=st.mockCode;
  const pool=MCQ.filter(q=>EXAM_TYPES.includes(q.type));
  const pick=[],used=new Set();
  const take=(ids,n)=>{const c=shuffle(pool.filter(q=>ids.includes(q.topic)&&!used.has(q.id))).sort((a,b)=>(isSeen(a)-isSeen(b))||(a.reserve-b.reserve));for(const q of c.slice(0,n)){pick.push(q.id);used.add(q.id)}};
  const tot=Object.values(MOCK_MIX).reduce((a,b)=>a+b,0);
  for(const [t,k] of Object.entries(MOCK_MIX))take([t],Math.floor(k*nM/tot));
  take(TOPICS.map(t=>t.id),nM-pick.length);
  const cpool=shuffle(CODING.filter(c=>c.difficulty<=2)).sort((a,b)=>((peekC(a.id).passed?1:0)-(peekC(b.id).passed?1:0))||(a.reserve-b.reserve));
  const codes=[];
  for(const t of ['T3','T4']){if(codes.length>=nC)break;const c=cpool.find(c=>c.topic===t&&!codes.includes(c.id));if(c)codes.push(c.id)}
  for(const c of cpool){if(codes.length>=nC)break;if(!codes.includes(c.id))codes.push(c.id)}
  const now=Date.now();
  return {v:2,phase:pick.length?'mcq':'code',start:now,phaseStart:now,mcqMin:st.mockMcqMin,codeMin:st.mockCodeMin,mcqSec:0,
    mcq:shuffle(pick),code:codes,ans:{},codeSrc:Object.fromEntries(codes.map(id=>[id,C_BY_ID[id].starter||''])),cur:0,curCode:0};
}
function mockNextPhase(){
  const M=S.activeMock;if(!M)return;
  if(M.phase==='mcq'&&M.code.length){M.mcqSec=Math.round((Date.now()-M.phaseStart)/1000);M.phase='code';M.phaseStart=Date.now();M.curCode=0;save();route()}
  else{if(M.phase==='mcq')M.mcqSec=Math.round((Date.now()-M.phaseStart)/1000);gradeMock()}
}
let mockTimer=null;
const mmss=ms=>{ms=Math.max(0,ms);return `${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms%60000/1000)).padStart(2,'0')}`};

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
